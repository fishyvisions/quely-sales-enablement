<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/quely-ds-final-b7eb1583-b8b7-4d02-9172-22ca351f866c/colors_and_type.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<style>
  body { margin:0; background:#1A1611; font-family:'Inter',sans-serif; }
  a { color:#C9C1F2; } a:hover { color:#C9AEF0; }

  /* Orbit reads each message in turn, then its conclusion settles in. */
  @keyframes qhc-mark  { from { opacity:.18; transform:scale(.7); box-shadow:0 0 0 0 rgba(143,91,215,0); }
                         to   { opacity:1;   transform:scale(1);  box-shadow:0 0 0 5px rgba(143,91,215,.22); } }
  @keyframes qhc-seat  { to { opacity:1; transform:translateX(0) scale(1); } }
  @keyframes qhc-rise  { to { opacity:1; transform:translateY(0); } }
  @keyframes qhc-glow  { 0%,100% { opacity:.35; } 50% { opacity:.75; } }

  [data-qhc][data-go] [data-el="mark"]    { animation:qhc-mark 520ms cubic-bezier(.3,0,0,1) var(--d) forwards; }
  [data-qhc][data-go] [data-el="insight"] { animation:qhc-seat 820ms cubic-bezier(.3,0,0,1) 2050ms forwards; }
  [data-qhc][data-go] [data-el="rise"]    { animation:qhc-rise 560ms cubic-bezier(.3,0,0,1) var(--d) forwards; }
  @media (prefers-reduced-motion: reduce) {
    [data-qhc] [data-el] { animation-duration:1ms !important; animation-delay:0ms !important; }
  }
</style>
</helmet>
<section style="position:relative; overflow:hidden; background:{{ sBg }}; padding:56px 40px 62px; display:flex; justify-content:center;">
  <div style="position:absolute; top:40%; right:6%; width:660px; height:460px; border-radius:50%; background:radial-gradient(closest-side, rgba(143,91,215,.20), rgba(143,91,215,0)); filter:blur(10px); pointer-events:none; animation:qhc-glow 8s ease-in-out infinite;"></div>

  <div style="position:relative; z-index:1; width:100%; max-width:1180px;">

    <div style="display:flex; flex-direction:column; align-items:center; text-align:center;">
      <div style="display:inline-flex; align-items:center; gap:9px; margin-bottom:16px;">
        <img src="assets/quely-mark-brand.svg" alt="" style="width:19px; height:19px;">
        <span style="font-family:'Geist Mono',monospace; font-size:12.5px; font-weight:700; letter-spacing:.13em; text-transform:uppercase; color:#C9C1F2;">{{ eyebrow }}</span>
      </div>
      <h1 style="margin:0 0 18px; max-width:900px; font-family:'Geist',sans-serif; font-size:50px; line-height:1.06; letter-spacing:-.04em; font-weight:800; color:{{ sInk }}; text-wrap:pretty;">{{ headline }}</h1>
      <p style="margin:0; max-width:760px; font-size:18px; line-height:1.6; color:{{ sDim }}; text-wrap:pretty;">{{ body }}</p>
    </div>

    <!-- asymmetric: the thread speaks on the left, Orbit concludes on the right -->
    <div data-qhc style="margin-top:40px; display:flex; align-items:center; gap:0;">

      <!-- LEFT: a real Quely thread -->
      <div style="position:relative; flex:1.3 1 0; min-width:0;">
        <div style="display:flex; align-items:center; gap:8px; margin-bottom:16px; padding-left:2px;">
          <img src="assets/quely-mark-brand.svg" alt="" style="width:13px; height:13px; opacity:.8;">
          <span style="font-size:11px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:rgba(255,255,255,.66); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">{{ spaceLabel }}</span>
        </div>

        <div style="position:relative;">
          <!-- grid pairs each message with its own connector cell, so the connector
               is anchored to that row's centre by construction at any height -->
          <div style="display:grid; grid-template-columns:minmax(0,1fr) 58px; row-gap:14px; align-items:stretch;">
            <sc-for list="{{ messages }}" as="m" hint-placeholder-count="3">
              <div style="{{ m.rowStyle }}">
                <span style="{{ m.avatarStyle }}">{{ m.initials }}</span>
                <div style="flex:1; min-width:0; background:#fff; border-radius:13px; padding:12px 15px 12px; box-shadow:0 18px 40px -20px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.11);">
                  <div style="display:flex; align-items:baseline; gap:8px; margin-bottom:5px;">
                    <span style="flex:none; font-size:12.5px; font-weight:700; color:#1A1611; white-space:nowrap;">{{ m.name }}</span>
                    <span style="flex:1; min-width:0; font-size:11px; color:#5C5345; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">{{ m.role }}</span>
                    <span style="flex:none; font-size:10.5px; color:#5C5345; white-space:nowrap;">{{ m.when }}</span>
                  </div>
                  <div style="font-size:13.5px; line-height:1.5; color:#1A1611; text-wrap:pretty;">{{ m.text }}</div>
                  <div style="display:flex; align-items:center; gap:6px; margin-top:9px;">
                    <i class="ph-fill ph-paperclip" style="flex:none; font-size:11px; color:#5C28A4;"></i>
                    <span style="flex:1; min-width:0; font-size:10.5px; font-weight:600; color:#5C5345; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">{{ m.anchor }}</span>
                  </div>
                </div>
                <!-- the marker Orbit lights as it reads this message -->
                <span data-el="mark" style="{{ m.markStyle }}"></span>
              </div>
              <div style="position:relative;">
                <span style="position:absolute; left:0; right:0; top:50%; height:1.5px; margin-top:-.75px; background:rgba(143,91,225,.36);"></span>
                <span style="{{ m.spineStyle }}"></span>
              </div>
            </sc-for>
          </div>

        </div>


      </div>

      <!-- RIGHT: Orbit speaks on a brand surface, not another white card -->
      <div data-el="insight" style="flex:1 1 0; min-width:0; opacity:0; transform:translateX(22px) scale(.97);">
        <div style="background:#5C28A4; border-radius:18px; overflow:hidden; box-shadow:0 24px 48px rgba(3,7,18,.18), 0 40px 84px -28px rgba(0,0,0,.9), 0 0 0 1px rgba(171,132,225,.34), 0 0 70px -18px rgba(143,91,215,.5);">

          <div style="display:flex; align-items:center; gap:10px; padding:15px 19px; border-bottom:1px solid rgba(255,255,255,.12);">
            <img src="assets/quely-orbit-pet.png" alt="" style="flex:none; width:26px; height:auto;">
            <span style="flex:1; min-width:0; font-size:12.5px; font-weight:700; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">{{ orbitLabel }}</span>
            <span style="flex:none; display:inline-flex; align-items:center; gap:6px; white-space:nowrap; background:rgba(248,113,113,.18); border:1px solid rgba(248,113,113,.42); border-radius:9999px; padding:4px 10px; font-size:10.5px; font-weight:700; color:#FECACA;"><i class="ph-fill ph-warning" style="font-size:11px;"></i>{{ severity }}</span>
          </div>

          <div style="padding:18px 20px 20px;">
            <div style="font-size:19px; line-height:1.45; font-weight:600; color:#fff; letter-spacing:-.008em; text-wrap:pretty;">{{ insight }}</div>

            <div data-el="rise" style="{{ actionsStyle }}">
              <span style="flex:none; display:inline-flex; align-items:center; gap:7px; white-space:nowrap; background:#fff; border-radius:9px; padding:9px 14px; font-size:12.5px; font-weight:700; color:#5C28A4;">
                <img src="assets/logos/linear.svg" alt="" style="width:13px; height:13px;">{{ actionPush }}
              </span>
              <span style="flex:none; display:inline-flex; align-items:center; gap:7px; white-space:nowrap; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.2); border-radius:9px; padding:9px 14px; font-size:12.5px; font-weight:600; color:#fff;">
                <i class="ph-fill ph-calendar-plus" style="font-size:14px;"></i>{{ actionMeet }}
              </span>
            </div>
            <div data-el="rise" style="{{ noteStyle }}">{{ actionNote }}</div>
          </div>
        </div>
      </div>

    </div>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1260,&quot;height&quot;:700},&quot;eyebrow&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Spot delivery risks early&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;headline&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;See what could delay delivery before it does.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;body&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Quely's AI reads across the conversations, meetings, work items, and dependencies in your Quely Space to reveal blockers, the work they affect, and where action is needed.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;spaceLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Space · Q3 platform release&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;orbitLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Orbit flagged a delivery risk&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;severity&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;High risk&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;insight&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Refunds sits on the critical path, is behind schedule, and depends on an API that freezes first. The release will slip unless the dependency is assigned this week.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;actionPush&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Create issue&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;actionMeet&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Schedule a meeting&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;actionNote&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Both remain anchored to the task.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;messages&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Array&lt;{name:string;role:string;when:string;tint?:string;text:string;anchor:string}&gt;&quot;}}">
class Component extends DCLogic {
  DEFAULT_SURFACE = 'ink';
  /* Surfaces are assigned by position on an assembled page, so a block must repaint
     itself rather than insist on the colour it shipped with. */
  SURFACES = {
    ink:    { bg:'#1A1611', ink:'#ECE7F2', dim:'rgba(236,231,242,.72)', line:'rgba(236,231,242,.16)', accent:'#9385E6', card:'#241F19', dark:true  },
    paper:  { bg:'#ECE7F2', ink:'#1A1611', dim:'#4B5563',               line:'#D9D2E6',               accent:'#5C28A4', card:'#FFFFFF', dark:false },
    lilac:  { bg:'#DED6F1', ink:'#1A1611', dim:'#4B5563',               line:'#C9C1E4',               accent:'#5C28A4', card:'#FFFFFF', dark:false },
    violet: { bg:'#41186F', ink:'#FFFFFF', dim:'rgba(255,255,255,.76)', line:'rgba(255,255,255,.20)', accent:'#C9C1F2', card:'#FFFFFF', dark:true  }
  };
  surf() {
    var k = (this.props && this.props.surface) || this.DEFAULT_SURFACE || 'paper';
    return this.SURFACES[k] || this.SURFACES.paper;
  }

  DEMO = {
    eyebrow: 'Spot delivery risks early',
    headline: 'See what could delay delivery before it does.',
    body: 'Quely\u2019s AI reads across the conversations, meetings, work items, and dependencies in your Quely Space to reveal blockers, the work they affect, and where action is needed.',
    spaceLabel: 'Space \u00b7 Q3 platform release',
    messages: [
      { name: 'Maya Osei', role: 'Release manager', when: '9d ago', tint: '#5C28A4',
        text: 'The payments API freeze lands mid-Q3. Anything depending on it has to merge before then.',
        anchor: 'Q3 platform release' },
      { name: 'Dev Raman', role: 'Platform', when: '6d ago', tint: '#2563EB',
        text: 'Checkout and refunds both depend on that same API window. Refunds is behind.',
        anchor: 'Payments API freeze' },
      { name: 'Sam Ellis', role: 'Engineer', when: '3d ago', tint: '#12652F',
        text: 'Refunds tokenization is still open, and nobody owns the dependency yet.',
        anchor: 'Refunds tokenization' }
    ],
    orbitLabel: 'Orbit flagged a delivery risk',
    severity: 'High risk',
    insight: 'Refunds sits on the critical path, is behind schedule, and depends on an API that freezes first. The release will slip unless the dependency is assigned this week.',
    actionPush: 'Create issue',
    actionMeet: 'Schedule a meeting',
    actionNote: 'Both remain anchored to the task.'
  };

  avatar(tint, px, fs) {
    return 'flex:none; width:' + px + 'px; height:' + px + 'px; border-radius:50%; background:' + tint
      + '; color:#fff; font-size:' + fs + 'px; font-weight:700; display:inline-flex; align-items:center; justify-content:center;';
  }
  initialsOf(n) { return (n || '?').split(/\s+/).map((w) => w[0]).join('').slice(0, 2).toUpperCase(); }

  RUN = 3900; HOLD = 3400;

  componentDidMount() {
    const node = document.querySelector('[data-qhc]');
    if (!node) return;
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      node.setAttribute('data-go', ''); return;
    }
    // Imperative attribute flip drives the CSS animation (style-attribute holes do
    // not re-apply on re-render). Loops only while on screen.
    this._visible = false;
    // Plays ONCE per entry into view, then holds the resolved state indefinitely —
    // the insight is the payoff, so it must not disappear. Replays only when the
    // block is scrolled away and back, or when the tab becomes visible again.
    const play = () => {
      node.removeAttribute('data-go');
      void node.offsetWidth;
      node.setAttribute('data-go', '');
    };
    if ('IntersectionObserver' in window) {
      this.io = new IntersectionObserver((entries) => {
        entries.forEach((e) => {
          if (e.isIntersecting && !this._visible) { this._visible = true; clearTimeout(this._t); this._t = setTimeout(play, 420); }
          else if (!e.isIntersecting && this._visible) { this._visible = false; }
        });
      }, { threshold: 0.25 });
      this.io.observe(node);
    } else { this._visible = true; play(); }
    this._onVis = () => { if (document.visibilityState === 'visible' && this._visible) { clearTimeout(this._t); play(); } };
    document.addEventListener('visibilitychange', this._onVis);
    // never leave the payload hidden if IntersectionObserver never fires
    this._safety = setTimeout(() => { this._visible = true; play(); }, 1200);
  }
  componentWillUnmount() {
    if (this.io) this.io.disconnect();
    if (this._onVis) document.removeEventListener('visibilitychange', this._onVis);
    clearTimeout(this._t); clearTimeout(this._safety);
  }

  renderVals() {
    const p = this.props || {}, D = this.DEMO;
    const raw = (p.messages && p.messages.length) ? p.messages : D.messages;
    const messages = raw.map((m, i) => ({
      name: m.name, role: m.role, when: m.when, text: m.text, anchor: m.anchor,
      initials: this.initialsOf(m.name),
      avatarStyle: this.avatar(m.tint || '#5C28A4', 32, 11) + ' margin-top:2px; box-shadow:0 0 0 3px ' + this.surf().bg + ';',
      rowStyle: 'display:flex; align-items:flex-start; gap:11px;'
        + (i === 1 ? ' padding-left:22px;' : '') + (i === 2 ? ' padding-left:44px;' : ''),
      markStyle: 'flex:none; align-self:center; width:8px; height:8px; border-radius:50%; background:#C9C1F2;'
        + ' margin-left:9px; opacity:.18; transform:scale(.7); --d:' + (900 + i * 340) + 'ms;',
      // Spine segment per row: extent is this row's own geometry, so the spine can
      // only ever run first-connector-centre -> last-connector-centre. GAP = row-gap.
      spineStyle: 'position:absolute; right:0; width:1.5px; background:rgba(143,91,225,.36); pointer-events:none;'
        + (i === 0 ? ' top:50%; bottom:-14px;'
          : (i === raw.length - 1 ? ' top:0; height:50%;' : ' top:0; bottom:-14px;'))
    }));
    var S = this.surf();
    return {
      sBg: S.bg, sInk: S.ink, sDim: S.dim, sLine: S.line, sAccent: S.accent, sCard: S.card,
      eyebrow: p.eyebrow ?? D.eyebrow,
      headline: p.headline ?? D.headline,
      body: p.body ?? D.body,
      spaceLabel: p.spaceLabel ?? D.spaceLabel,
      orbitLabel: p.orbitLabel ?? D.orbitLabel,
      severity: p.severity ?? D.severity,
      insight: p.insight ?? D.insight,
      actionPush: p.actionPush ?? D.actionPush,
      actionMeet: p.actionMeet ?? D.actionMeet,
      actionNote: p.actionNote ?? D.actionNote,
      messages: messages,
      actionsStyle: 'display:flex; align-items:center; flex-wrap:wrap; gap:9px; margin-top:16px;'
        + ' opacity:0; transform:translateY(8px); --d:3050ms;',
      noteStyle: 'margin-top:10px; font-size:10.5px; color:rgba(255,255,255,.74);'
        + ' opacity:0; transform:translateY(8px); --d:3340ms;'
    };
  }
}
</script>
</body>
</html>
