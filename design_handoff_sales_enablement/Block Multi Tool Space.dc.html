<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/quely-ds-final-b7eb1583-b8b7-4d02-9172-22ca351f866c/colors_and_type.css">
<script src="_ds/quely-ds-final-b7eb1583-b8b7-4d02-9172-22ca351f866c/_ds_bundle.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<style>
  body { margin:0; background:#ECE7F2; font-family:'Inter',sans-serif; }
  a { color:#5C28A4; } a:hover { color:#41186F; }

  @keyframes qmt-in  { to { opacity:1; transform:translateY(0); } }
  [data-qmt][data-go][data-el="in"],
  [data-qmt][data-go] [data-el="in"] { animation:qmt-in 460ms cubic-bezier(.3,0,0,1) 160ms forwards; }
  @media (prefers-reduced-motion: reduce) {
    [data-qmt][data-el], [data-qmt] [data-el] { animation-duration:1ms !important; animation-delay:0ms !important; }
  }
</style>
</helmet>
<section style="position:relative; overflow:hidden; background:{{ sBg }}; padding:80px 40px; display:flex; justify-content:center;">
  <div style="position:absolute; inset:0; z-index:0; pointer-events:none; opacity:.5; background-image:radial-gradient(rgba(26,22,17,0.05) 1px, transparent 1px); background-size:26px 26px;"></div>
  <div style="position:absolute; top:250px; left:50%; width:1100px; height:600px; transform:translateX(-50%); border-radius:50%; background:radial-gradient(closest-side, rgba(143,91,215,.14), rgba(143,91,215,0)); filter:blur(8px); pointer-events:none; z-index:0;"></div>

  <div style="position:relative; z-index:1; width:100%; max-width:1180px;">

    <div style="max-width:820px; margin:0 auto; text-align:center;">
      <div style="font-family:'Geist Mono',monospace; font-size:12px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:#5C28A4; margin-bottom:14px;">{{ eyebrow }}</div>
      <h2 style="margin:0 0 14px; font-family:'Geist',sans-serif; font-size:32px; line-height:1.15; letter-spacing:-.04em; font-weight:700; color:#1A1611; text-wrap:pretty;">{{ headline }}</h2>
      <p style="margin:0; font-size:16px; line-height:1.6; color:#5C5345; text-wrap:pretty;">{{ body }}</p>
    </div>

    <!-- ============ ONE SPACE ============ -->
        <!-- the product itself: a Space with the Queue open over it -->
        <div data-qmt data-el="in" style="margin-top:18px; opacity:0; transform:translateY(10px); border:2px solid #1A1611; overflow:hidden; background:#F8F5FB; box-shadow:6px 6px 0 #1A1611;">
          <img src="assets/quely-queue-space.png" alt="A Quely Space with the Queue open, holding work pulled from Jira, Linear, Trello and other tools" style="display:block; width:100%; height:auto;">
        </div>

  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1260,&quot;height&quot;:1120},&quot;eyebrow&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;One Space across your project tools&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;headline&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Bring every team's part of the project into one place.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;body&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Pull work from the tools each team uses into a Space, so everyone can see the full project, discuss the work, schedule meetings, and find what they need in one place.&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  DEFAULT_SURFACE = 'paper';
  /* Surfaces are assigned by position on an assembled page, so a block must repaint
     itself rather than insist on the colour it shipped with. */
  SURFACES = {
    ink:    { bg:'#1A1611', ink:'#ECE7F2', dim:'rgba(236,231,242,.72)', line:'rgba(236,231,242,.16)', accent:'#9385E6', card:'#241F19', dark:true  },
    paper:  { bg:'#ECE7F2', ink:'#1A1611', dim:'#4B5563',               line:'#D9D2E6',               accent:'#5C28A4', card:'#FFFFFF', dark:false },
    lilac:  { bg:'#DED6F1', ink:'#1A1611', dim:'#4B5563',               line:'#C9C1E4',               accent:'#5C28A4', card:'#FFFFFF', dark:false },
    violet: { bg:'#41186F', ink:'#FFFFFF', dim:'rgba(255,255,255,.76)', line:'rgba(255,255,255,.20)', accent:'#C9C1F2', card:'#FFFFFF', dark:true  }
  };
  surf() {
    var k = (this.props && this.props.surface) || this.DEFAULT_SURFACE || 'paper';
    return this.SURFACES[k] || this.SURFACES.paper;
  }

  DEMO = {
    eyebrow: 'One Space across your project tools',
    headline: 'Bring every team’s part of the project into one place.',
    body: 'Pull work from the tools each team uses into a Space, so everyone can see the full project, discuss the work, schedule meetings, and find what they need in one place.',

  };

  componentDidMount() {
    // The stage may not be in the DOM yet at mount in this runtime, so poll for it
    // instead of early-returning, and guarantee reveal with an unconditional fallback.
    this._played = false;
    const play = () => {
      if (this._played) return;
      const n = document.querySelector('[data-qmt]');
      if (!n) return;
      this._played = true;
      n.setAttribute('data-go', '');
    };
    this._safety = setTimeout(play, 2200);

    let tries = 0;
    const attach = () => {
      const node = document.querySelector('[data-qmt]');
      if (!node) { if (++tries < 40) { this._poll = setTimeout(attach, 60); } return; }
      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) { play(); return; }
      if (!('IntersectionObserver' in window)) { play(); return; }
      this.io = new IntersectionObserver((entries) => {
        entries.forEach((e) => {
          if (e.isIntersecting) { this._t = setTimeout(play, 300); }
          else if (!this._played) { clearTimeout(this._t); }
        });
      }, { threshold: 0.12 });
      this.io.observe(node);
    };
    attach();
  }
  componentWillUnmount() {
    if (this.io) this.io.disconnect();
    clearTimeout(this._t); clearTimeout(this._poll); clearTimeout(this._safety);
  }

  renderVals() {
    const p = this.props || {}, D = this.DEMO;

    var S = this.surf();

    return {
      sBg: S.bg, sInk: S.ink, sDim: S.dim, sLine: S.line, sAccent: S.accent, sCard: S.card,
      eyebrow: p.eyebrow ?? D.eyebrow,
      headline: p.headline ?? D.headline,
      body: p.body ?? D.body
    };
  }
}
</script>
</body>
</html>
