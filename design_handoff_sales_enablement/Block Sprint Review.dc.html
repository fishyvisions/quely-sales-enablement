<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/quely-ds-final-b7eb1583-b8b7-4d02-9172-22ca351f866c/colors_and_type.css">
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<style>
  body { margin:0; background:#EEF2FF; font-family:'Inter',sans-serif; }
  a { color:#4338CA; } a:hover { color:#3730A3; }
  @keyframes qsr-in { to { opacity:1; transform:translateY(0); } }
  [data-qsr][data-go] [data-el="r"] { animation:qsr-in 520ms cubic-bezier(.3,0,0,1) var(--d) forwards; }
  @media (prefers-reduced-motion: reduce) {
    [data-qsr] [data-el] { animation-duration:1ms !important; animation-delay:0ms !important; }
  }
</style>
</helmet>
<section data-qsr style="position:relative; background:linear-gradient(180deg, #EEF2FF 0%, #F5F3FF 100%); padding:80px clamp(20px, 4vw, 40px); display:flex; justify-content:center;">
  <div style="position:relative; width:100%; max-width:1180px;">

    <div style="max-width:820px; margin:0 auto; text-align:center;">
      <div data-el="r" style="{{ eyebrowStyle }}">
        <span style="flex:none; width:19px; height:19px; background:url('assets/quely-mark-brand.svg') center/contain no-repeat;"></span>
        <span style="min-width:0; font-size:12px; font-weight:700; letter-spacing:.13em; text-transform:uppercase; color:#4338CA; text-wrap:pretty;">{{ eyebrow }}</span>
      </div>
      <h2 data-el="r" style="{{ headlineStyle }}">{{ headline }}</h2>
      <p data-el="r" style="{{ bodyStyle }}">{{ body }}</p>
    </div>

    <!-- the sprint ledger: every item carries the context that explains its outcome -->
    <div data-el="r" style="{{ ledgerStyle }}">

      <div style="display:flex; align-items:center; flex-wrap:wrap; gap:12px; padding:16px 20px; border-bottom:1px solid #E0E4F8; background:#F7F8FE;">
        <span style="flex:none; font-size:15px; font-weight:800; letter-spacing:-.012em; color:#1E1B4B;">{{ sprintName }}</span>
        <span style="flex:1 1 auto; min-width:0; font-size:12.5px; color:#4B5563;">{{ sprintDates }}</span>
        <sc-for list="{{ tallies }}" as="t" hint-placeholder-count="3">
          <span style="{{ t.style }}"><i class="{{ t.icon }}" style="font-size:13px;"></i>{{ t.label }}</span>
        </sc-for>
      </div>

      <sc-for list="{{ items }}" as="it" hint-placeholder-count="4">
        <div style="{{ it.rowStyle }}">

          <div style="flex:1 1 320px; min-width:260px;">
            <div style="display:flex; align-items:center; flex-wrap:wrap; gap:9px;">
              <span style="{{ it.statusStyle }}"><i class="{{ it.statusIcon }}" style="font-size:12px;"></i>{{ it.status }}</span>
              <span style="flex:none; display:inline-flex; align-items:center; gap:6px; white-space:nowrap; background:#F9FAFB; border:1px solid #E5E7EB; border-radius:6px; padding:3px 8px; font-size:11px; font-weight:700; color:#111827;">
                <span style="width:11px; height:11px; background:url('assets/logos/jira.svg') center/contain no-repeat;"></span>{{ it.key }}
              </span>
            </div>
            <div style="margin-top:9px; font-size:15px; line-height:1.35; font-weight:700; color:#111827; text-wrap:pretty;">{{ it.title }}</div>
          </div>

          <!-- the part a board can't show: why it landed the way it did -->
          <div style="flex:1 1 340px; min-width:280px; display:flex; flex-direction:column; gap:8px;">
            <sc-for list="{{ it.context }}" as="cx" hint-placeholder-count="2">
              <div style="display:flex; align-items:flex-start; gap:9px;">
                <i class="{{ cx.icon }}" style="flex:none; margin-top:1px; font-size:14px; color:{{ cx.tint }};"></i>
                <div style="flex:1; min-width:0;">
                  <span style="font-size:10px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:#4B5563;">{{ cx.kind }}</span>
                  <div style="margin-top:2px; font-size:12.5px; line-height:1.5; color:#374151; text-wrap:pretty;">{{ cx.text }}</div>
                </div>
              </div>
            </sc-for>
          </div>

        </div>
      </sc-for>
    </div>

    <!-- retro actions become assigned work in the next sprint -->
    <div data-el="r" style="{{ retroStyle }}">

      <div style="flex:1 1 300px; min-width:280px;">
        <div style="display:flex; align-items:center; gap:9px; margin-bottom:14px;">
          <span style="flex:none; width:22px; height:22px; background:url('assets/quely-orbit-mascot.png') center/contain no-repeat;"></span>
          <span style="flex:1; min-width:0; font-size:13px; font-weight:700; color:#111827;">{{ retroLabel }}</span>
        </div>
        <div style="display:flex; flex-direction:column; gap:9px;">
          <sc-for list="{{ retroItems }}" as="ri" hint-placeholder-count="3">
            <div style="display:flex; align-items:flex-start; gap:10px; background:#fff; border:1px solid #E5E7EB; border-radius:10px; padding:12px 14px; box-shadow:0 1px 2px rgba(3,7,18,.05);">
              <i class="ph-fill ph-check-square" style="flex:none; margin-top:1px; font-size:15px; color:#4338CA;"></i>
              <span style="flex:1; min-width:0; font-size:13px; line-height:1.5; color:#1F2937; text-wrap:pretty;">{{ ri.text }}</span>
            </div>
          </sc-for>
        </div>
      </div>

      <div style="{{ arrowStyle }}"><i class="ph-bold ph-arrow-right" style="font-size:17px; color:#6366F1;"></i></div>

      <div style="flex:1 1 300px; min-width:280px;">
        <div style="display:flex; align-items:center; gap:9px; margin-bottom:14px;">
          <span style="flex:none; width:17px; height:17px; background:url('assets/logos/jira.svg') center/contain no-repeat;"></span>
          <span style="flex:1; min-width:0; font-size:13px; font-weight:700; color:#111827;">{{ nextLabel }}</span>
        </div>
        <div style="display:flex; flex-direction:column; gap:9px;">
          <sc-for list="{{ nextItems }}" as="ni" hint-placeholder-count="3">
            <div style="background:#fff; border:1px solid #C7D2FE; border-radius:10px; padding:12px 14px; box-shadow:0 1px 2px rgba(3,7,18,.05);">
              <div style="font-size:13px; line-height:1.4; font-weight:600; color:#111827; text-wrap:pretty;">{{ ni.text }}</div>
              <div style="display:flex; align-items:center; flex-wrap:wrap; gap:8px; margin-top:9px;">
                <span style="flex:none; display:inline-flex; align-items:center; gap:6px; white-space:nowrap; background:#EEF2FF; border:1px solid #C7D2FE; border-radius:9999px; padding:3px 10px 3px 3px; font-size:11px; font-weight:600; color:#3730A3;">
                  <span style="{{ ni.avStyle }}">{{ ni.initials }}</span>{{ ni.owner }}
                </span>
                <span style="flex:none; white-space:nowrap; background:#F9FAFB; border:1px solid #E5E7EB; border-radius:6px; padding:3px 8px; font-size:11px; font-weight:700; color:#374151;">{{ ni.key }}</span>
                <span style="flex:none; display:inline-flex; align-items:center; gap:5px; white-space:nowrap; font-size:11px; font-weight:600; color:#4B5563;"><i class="ph-fill ph-flag" style="font-size:11px; color:#6366F1;"></i>{{ ni.sprint }}</span>
              </div>
            </div>
          </sc-for>
        </div>
      </div>

    </div>

  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1260,&quot;height&quot;:1180},&quot;eyebrow&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Sprint review and retrospective&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;headline&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Understand what changed, what blocked delivery, and what should carry into the next sprint.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;body&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Review completed and unfinished work alongside the blockers, scope changes, decisions, dependencies, and discussions that shaped delivery. Convert agreed retrospective actions into assigned work for the next cycle.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;sprintName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Sprint 24&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;sprintDates&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;11 - 24 August&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;retroLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Orbit found 3 retrospective actions&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;nextLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Assigned work in Sprint 25&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;closer&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;The review reads from the same Space the work happened in, so the reasons behind each outcome are already there.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;items&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Array&lt;{status:string;tone:string;key:string;title:string;context:Array&lt;{kind:string;icon:string;tint:string;text:string}&gt;}&gt;&quot;},&quot;tallies&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Array&lt;{label:string;icon:string;tone:string}&gt;&quot;},&quot;retroItems&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Array&lt;{text:string}&gt;&quot;},&quot;nextItems&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Array&lt;{text:string;owner:string;tint:string;key:string;sprint:string}&gt;&quot;}}">
class Component extends DCLogic {
  DEMO = {
    eyebrow: 'Sprint review and retrospective',
    headline: 'Understand what changed, what blocked delivery, and what should carry into the next sprint.',
    body: 'Review completed and unfinished work alongside the blockers, scope changes, decisions, dependencies, and discussions that shaped delivery. Convert agreed retrospective actions into assigned work for the next cycle.',

    sprintName: 'Sprint 24',
    sprintDates: '11 - 24 August',
    tallies: [
      { label: '9 shipped',      icon: 'ph-fill ph-check-circle', tone: 'green' },
      { label: '3 carried over', icon: 'ph-fill ph-arrow-u-up-right', tone: 'amber' },
      { label: '2 blocked',      icon: 'ph-fill ph-warning', tone: 'red' }
    ],

    // each row pairs an outcome with the context that explains it
    items: [
      { status: 'Shipped', tone: 'green', key: 'PAY-388',
        title: 'Card checkout flow',
        context: [
          { kind: 'Scope change', icon: 'ph-fill ph-arrows-left-right', tint: '#B45309',
            text: 'Narrowed to card only on 14 Aug so the renewal date could hold.' },
          { kind: 'Decision', icon: 'ph-fill ph-seal-check', tint: '#15803D',
            text: 'Wallet and ACH deferred to the next cycle, agreed in planning.' }
        ] },
      { status: 'Carried over', tone: 'amber', key: 'PAY-402',
        title: 'Refunds tokenization',
        context: [
          { kind: 'Blocker', icon: 'ph-fill ph-warning', tint: '#B91C1C',
            text: 'Waited nine days on the payments API freeze before work could start.' },
          { kind: 'Dependency', icon: 'ph-fill ph-graph', tint: '#2563EB',
            text: 'Platform team owns the API window; unassigned until 19 Aug.' }
        ] },
      { status: 'Blocked', tone: 'red', key: 'PAY-415',
        title: 'Support briefing on reduced scope',
        context: [
          { kind: 'Discussion', icon: 'ph-fill ph-chat-circle-dots', tint: '#5C28A4',
            text: 'Raised twice in the Space; no owner was assigned either time.' }
        ] },
      { status: 'Shipped', tone: 'green', key: 'PAY-377',
        title: 'Checkout analytics events',
        context: [
          { kind: 'Discussion', icon: 'ph-fill ph-chat-circle-dots', tint: '#5C28A4',
            text: 'Drop-off data from this work is what triggered the scope change.' }
        ] }
    ],

    retroLabel: 'Orbit found 3 retrospective actions',
    retroItems: [
      { text: 'Assign a dependency owner at planning, not mid-sprint.' },
      { text: 'Flag API freeze dates in the Space before the sprint is committed.' },
      { text: 'Give every cross-team briefing a named owner.' }
    ],

    nextLabel: 'Assigned work in Sprint 25',
    nextItems: [
      // people get their own palette, kept clear of the green/amber/red status tones
      // so an avatar can never read as a status, and clear of brand violet
      { text: 'Add a dependency-owner step to sprint planning', owner: 'Maya',  tint: '#0F766E', key: 'PAY-431', sprint: 'Sprint 25' },
      { text: 'Track platform freeze dates in the release Space', owner: 'Dev', tint: '#4338CA', key: 'PAY-432', sprint: 'Sprint 25' },
      { text: 'Own the support briefing for scope changes',       owner: 'Sam', tint: '#BE185D', key: 'PAY-433', sprint: 'Sprint 25' }
    ],

    closer: 'The review reads from the same Space the work happened in, so the reasons behind each outcome are already there.'
  };

  TONE = {
    green: { ink:'#15803D', wash:'#DCFCE7', line:'#BBF7D0' },
    amber: { ink:'#B45309', wash:'#FEF3C7', line:'#FDE68A' },
    red:   { ink:'#B91C1C', wash:'#FEE2E2', line:'#FECACA' }
  };
  STATUS_ICON = { green:'ph-fill ph-check-circle', amber:'ph-fill ph-arrow-u-up-right', red:'ph-fill ph-warning' };

  componentDidMount() {
    const start = () => {
      const node = document.querySelector('[data-qsr]');
      if (!node) { this._poll = setTimeout(start, 120); return; }
      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        node.setAttribute('data-go', ''); return;
      }
      // Imperative attribute flip drives the CSS animation (style-attribute holes do
      // not re-apply on re-render). Plays once when it first enters view.
      const play = () => { if (this._played) return; this._played = true; node.setAttribute('data-go', ''); };
      if ('IntersectionObserver' in window) {
        this.io = new IntersectionObserver((entries) => {
          entries.forEach((e) => { if (e.isIntersecting) { this._t = setTimeout(play, 220); } });
        }, { threshold: 0.06 });
        this.io.observe(node);
      }
      this._safety = setTimeout(play, 2200);
    };
    this._played = false;
    start();
  }
  componentWillUnmount() {
    if (this.io) this.io.disconnect();
    clearTimeout(this._t); clearTimeout(this._poll); clearTimeout(this._safety);
  }

  renderVals() {
    const p = this.props || {}, D = this.DEMO;
    const rawItems = p.items && p.items.length ? p.items : D.items;
    const last = rawItems.length - 1;

    return {
      eyebrow: p.eyebrow ?? D.eyebrow,
      headline: p.headline ?? D.headline,
      body: p.body ?? D.body,
      sprintName: p.sprintName ?? D.sprintName,
      sprintDates: p.sprintDates ?? D.sprintDates,
      retroLabel: p.retroLabel ?? D.retroLabel,
      nextLabel: p.nextLabel ?? D.nextLabel,
      closer: p.closer ?? D.closer,

      eyebrowStyle: 'display:flex; align-items:center; justify-content:center; gap:9px; margin-bottom:16px;'
        + ' opacity:0; transform:translateY(10px); --d:60ms;',
      headlineStyle: 'margin:0; font-size:clamp(28px, 3.2vw, 38px); line-height:1.14; letter-spacing:-.026em;'
        + ' font-weight:700; color:#1E1B4B; text-wrap:pretty; opacity:0; transform:translateY(10px); --d:140ms;',
      bodyStyle: 'margin:16px 0 0; font-size:16px; line-height:1.65; color:#4B5563; text-wrap:pretty;'
        + ' opacity:0; transform:translateY(10px); --d:220ms;',

      ledgerStyle: 'margin-top:36px; background:#fff; border:1px solid #D9DEF7; border-radius:12px;'
        + ' overflow:hidden; box-shadow:0 12px 24px rgba(49,46,129,.08), 0 1px 2px rgba(3,7,18,.06);'
        + ' opacity:0; transform:translateY(12px); --d:320ms;',

      tallies: (p.tallies && p.tallies.length ? p.tallies : D.tallies).map((t) => {
        const c = this.TONE[t.tone] || this.TONE.green;
        return {
          label: t.label, icon: t.icon,
          style: 'flex:none; display:inline-flex; align-items:center; gap:6px; white-space:nowrap;'
            + ' border-radius:9999px; padding:5px 12px; font-size:12px; font-weight:700;'
            + ' color:' + c.ink + '; background:' + c.wash + '; border:1px solid ' + c.line + ';'
        };
      }),

      items: rawItems.map((it, i) => {
        const c = this.TONE[it.tone] || this.TONE.green;
        return {
          status: it.status, key: it.key, title: it.title, context: it.context || [],
          statusIcon: this.STATUS_ICON[it.tone] || this.STATUS_ICON.green,
          statusStyle: 'flex:none; display:inline-flex; align-items:center; gap:6px; white-space:nowrap;'
            + ' border-radius:9999px; padding:3px 10px; font-size:11px; font-weight:700;'
            + ' color:' + c.ink + '; background:' + c.wash + '; border:1px solid ' + c.line + ';',
          rowStyle: 'display:flex; flex-wrap:wrap; gap:22px; padding:20px;'
            + (i < last ? ' border-bottom:1px solid #F3F4F6;' : '')
        };
      }),

      retroStyle: 'display:flex; flex-wrap:wrap; align-items:flex-start; gap:20px; margin-top:20px;'
        + ' background:rgba(255,255,255,.6); border:1px solid #D9DEF7; border-radius:12px; padding:22px;'
        + ' opacity:0; transform:translateY(12px); --d:420ms;',
      arrowStyle: 'flex:0 0 34px; align-self:center; display:flex; align-items:center; justify-content:center;',

      retroItems: p.retroItems && p.retroItems.length ? p.retroItems : D.retroItems,
      nextItems: (p.nextItems && p.nextItems.length ? p.nextItems : D.nextItems).map((n) => ({
        text: n.text, owner: n.owner, key: n.key, sprint: n.sprint,
        initials: (n.owner || '?').slice(0, 1).toUpperCase(),
        avStyle: 'flex:none; display:inline-flex; align-items:center; justify-content:center; width:19px;'
          + ' height:19px; border-radius:50%; background:' + (n.tint || '#5C28A4') + '; color:#fff;'
          + ' font-size:9px; font-weight:700;'
      })),

      closerStyle: 'margin:22px 0 0; max-width:820px; font-size:16.5px; line-height:1.5; font-weight:600;'
        + ' color:#111827; text-wrap:pretty; opacity:0; transform:translateY(10px); --d:520ms;'
    };
  }
}
</script>
</body>
</html>
