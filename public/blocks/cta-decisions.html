<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="/assets/colors_and_type.css">
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<style>
  body { margin:0; background:#03070F; font-family:'Inter',sans-serif; }
  a { color:#AB84E1; } a:hover { color:#C9AEF0; }
  @keyframes qcd-in { to { opacity:1; transform:translateY(0); } }
  [data-qcd][data-go] [data-el="copy"] { animation:qcd-in 540ms cubic-bezier(.3,0,0,1) var(--d) forwards; }
  @media (prefers-reduced-motion: reduce) {
    [data-qcd] [data-el] { animation-duration:1ms !important; animation-delay:0ms !important; }
  }
</style>
</helmet>
<section style="position:relative; overflow:hidden; background:#03070F; padding:92px 40px 100px; display:flex; justify-content:center;">
  <div style="position:absolute; bottom:-34%; left:-6%; width:880px; height:620px; border-radius:50%; background:radial-gradient(closest-side, rgba(143,91,215,.2), rgba(143,91,215,0)); filter:blur(10px); pointer-events:none;"></div>

  <div data-qcd style="position:relative; z-index:1; width:100%; max-width:860px; display:flex; flex-direction:column; align-items:center; text-align:center;">

    <div data-el="copy" style="{{ eyebrowStyle }}">
      <span style="flex:none; width:20px; height:20px; background:url('/assets/quely-mark-brand.svg') center/contain no-repeat;"></span>
      <span style="min-width:0; font-size:11.5px; font-weight:700; letter-spacing:.15em; text-transform:uppercase; color:#AB84E1; text-wrap:pretty;">{{ eyebrow }}</span>
    </div>

    <h2 data-el="copy" style="{{ headlineStyle }}">{{ headline }}</h2>
    <p data-el="copy" style="{{ bodyStyle }}">{{ body }}</p>

    <div data-el="copy" style="{{ actionsStyle }}">
      <a href="{{ primaryHref }}" style="text-decoration:none;">
        <span style="display:inline-flex; align-items:center; justify-content:center; gap:9px; background:#5C28A4; border:1px solid transparent; border-radius:8px; padding:15px 26px; font-size:15px; font-weight:700; color:#fff; box-shadow:0 24px 48px rgba(3,7,18,.18);">
          {{ primaryCta }}<i class="ph-bold ph-arrow-right" style="font-size:15px;"></i>
        </span>
      </a>
    </div>
    <div style="{{ contactStyle }}">{{ contact }}</div>

  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1260,&quot;height&quot;:540}}">
class Component extends DCLogic {
  DEMO = {
    eyebrow: 'See Quely with your own work',
    headline: 'See every decision with the reasoning behind it.',
    body: 'Bring a project or work item into Quely. See how it provides visibility into what was decided, why it changed, the options considered, and who owns the next step.',
    primaryCta: 'Try Quely',
    primaryHref: 'https://meetings.hubspot.com/ronma2/?utm_source=sales_enablement&utm_medium=block',
    contact: 'quely.io · ronma@quely.io'
  };

  componentDidMount() {
    const start = () => {
      const node = document.querySelector('[data-qcd]');
      if (!node) { this._poll = setTimeout(start, 120); return; }
      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        node.setAttribute('data-go', ''); return;
      }
      const play = () => { if (this._played) return; this._played = true; node.setAttribute('data-go', ''); };
      if ('IntersectionObserver' in window) {
        this.io = new IntersectionObserver((entries) => {
          entries.forEach((e) => { if (e.isIntersecting) { this._t = setTimeout(play, 240); } });
        }, { threshold: 0.2 });
        this.io.observe(node);
      }
      this._safety = setTimeout(play, 2200);
    };
    this._played = false;
    start();
  }
  componentWillUnmount() {
    if (this.io) this.io.disconnect();
    clearTimeout(this._t); clearTimeout(this._poll); clearTimeout(this._safety);
  }

  renderVals() {
    const p = this.props || {}, D = this.DEMO;
    return {
      eyebrow: p.eyebrow ?? D.eyebrow,
      headline: p.headline ?? D.headline,
      body: p.body ?? D.body,
      primaryCta: p.primaryCta ?? D.primaryCta,
      primaryHref: p.primaryHref ?? D.primaryHref,
      contact: p.contact ?? D.contact,

      eyebrowStyle: 'display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:22px;'
        + ' opacity:0; transform:translateY(10px); --d:100ms;',
      headlineStyle: 'margin:0; max-width:820px; font-size:clamp(30px, 3.8vw, 46px); line-height:1.09;'
        + ' letter-spacing:-.03em; font-weight:800; color:#fff; text-wrap:pretty; overflow-wrap:anywhere;'
        + ' opacity:0; transform:translateY(12px); --d:200ms;',
      bodyStyle: 'margin:20px 0 0; max-width:660px; font-size:17px; line-height:1.6; color:rgba(255,255,255,.66);'
        + ' text-wrap:pretty; opacity:0; transform:translateY(12px); --d:320ms;',
      contactStyle: 'margin-top:26px; font-size:14px; color:rgba(255,255,255,.72);',
      actionsStyle: 'display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:12px;'
        + ' margin-top:36px; opacity:0; transform:translateY(12px); --d:440ms;'
    };
  }
}
</script>
</body>
</html>
