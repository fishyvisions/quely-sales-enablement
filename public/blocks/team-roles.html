<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="/assets/colors_and_type.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<style>
  body { margin:0; background:#F5F1FC; font-family:'Inter',sans-serif; }
  a { color:#5C28A4; } a:hover { color:#41186F; }

  /* three equal columns hold to ~820px viewport; below that they stack, and the
     separator and accent radii switch so the stacked state is styled on purpose */
  @media (max-width: 820px) {
    [data-qtr] [data-cols] { grid-template-columns:1fr !important; }
    [data-qtr] [data-col] { border-left:0 !important; }
    [data-qtr] [data-col] + [data-col] { border-top:1px solid #F3F4F6 !important; }
    [data-qtr] [data-col] [data-edge] { border-radius:0 !important; }
    [data-qtr] [data-col]:first-child [data-edge] { border-radius:13px 13px 0 0 !important; }
  }

  @keyframes qtr-in { to { opacity:1; transform:translateY(0); } }
  [data-qtr][data-go] [data-el="col"] { animation:qtr-in 520ms cubic-bezier(.3,0,0,1) var(--d) forwards; }
  [data-qtr] [data-col] { transition:background 200ms cubic-bezier(.2,0,0,1); }
  [data-qtr] [data-col]:hover { background:#FCFAFE; }
  @media (prefers-reduced-motion: reduce) {
    [data-qtr] [data-el] { animation-duration:1ms !important; animation-delay:0ms !important; }
  }
</style>
</helmet>
<section style="position:relative; overflow:hidden; background:{{ sBg }}; padding:0; display:flex; justify-content:center;">
  <div style="position:relative; z-index:1; width:100%;">

    <div data-qtr style="padding:80px 40px; display:flex; justify-content:center;">
      <div style="width:100%; max-width:1180px;">
        <div style="max-width:860px; margin:0 auto; text-align:center;">
        <div style="display:inline-flex; align-items:center; gap:9px; margin-bottom:14px;">
          <span style="flex:none; width:18px; height:18px; background:url('/assets/quely-mark-brand.svg') center/contain no-repeat;"></span>
          <span style="font-family:'Geist Mono',monospace; font-size:12px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:#5C28A4;">{{ eyebrow }}</span>
        </div>
        <h2 style="margin:0; font-family:'Geist',sans-serif; font-size:32px; line-height:1.15; letter-spacing:-.04em; font-weight:700; color:#1A1611; text-wrap:pretty;">{{ headline }}</h2>
        </div>

        <!-- one bordered container, divided into three columns by hairline rules -->
        <div data-cols style="margin-top:34px; background:#fff; border:1px solid #C9C1F2; border-radius:14px; box-shadow:0 1px 2px rgba(3,7,18,.10); display:grid; grid-template-columns:repeat(3, minmax(0,1fr));">
          <sc-for list="{{ roles }}" as="r" hint-placeholder-count="3">
            <div data-el="col" data-col style="{{ r.wrapStyle }}">
              <span data-edge style="{{ r.edgeStyle }}"></span>
              <div style="display:flex; align-items:center; gap:11px;">
                <i class="{{ r.icon }}" style="flex:none; font-size:19px; color:{{ r.tint }};"></i>
                <span style="flex:1; min-width:0; font-size:18px; line-height:1.25; font-weight:700; letter-spacing:-.014em; color:#1A1611; text-wrap:pretty;">{{ r.name }}</span>
              </div>
              <p style="margin:12px 0 0; font-size:14.5px; line-height:1.6; color:#5C5345; text-wrap:pretty;">{{ r.text }}</p>
            </div>
          </sc-for>
        </div>
      </div>
    </div>

  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1260,&quot;height&quot;:520},&quot;eyebrow&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;One shared view for the whole team&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;headline&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Give everyone the information they need to move the work forward.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;roles&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Array&lt;{name:string;icon:string;tint:string;text:string}&gt;&quot;}}">
class Component extends DCLogic {
  DEFAULT_SURFACE = 'paper';
  /* Surfaces are assigned by position on an assembled page, so a block must repaint
     itself rather than insist on the colour it shipped with. */
  SURFACES = {
    ink:    { bg:'#1A1611', ink:'#ECE7F2', dim:'rgba(236,231,242,.72)', line:'rgba(236,231,242,.16)', accent:'#9385E6', card:'#241F19', dark:true  },
    paper:  { bg:'#ECE7F2', ink:'#1A1611', dim:'#4B5563',               line:'#D9D2E6',               accent:'#5C28A4', card:'#FFFFFF', dark:false },
    lilac:  { bg:'#DED6F1', ink:'#1A1611', dim:'#4B5563',               line:'#C9C1E4',               accent:'#5C28A4', card:'#FFFFFF', dark:false },
    violet: { bg:'#41186F', ink:'#FFFFFF', dim:'rgba(255,255,255,.76)', line:'rgba(255,255,255,.20)', accent:'#C9C1F2', card:'#FFFFFF', dark:true  }
  };
  surf() {
    var k = (this.props && this.props.surface) || this.DEFAULT_SURFACE || 'paper';
    return this.SURFACES[k] || this.SURFACES.paper;
  }

  DEMO = {
    eyebrow: 'One shared view for the whole team',
    headline: 'Give everyone the information they need to move the work forward.',
    roles: [
      { name: 'Engineering managers', icon: 'ph-fill ph-gauge', tint: '#5C28A4',
        text: 'See what changed, what is blocked, where capacity is tight, and which decisions need attention, without interrupting the team for updates.' },
      { name: 'Product managers', icon: 'ph-fill ph-git-branch', tint: '#2563EB',
        text: 'Keep requirements, scope changes, decisions, and supporting information connected to the work, so you do not have to repeat the same explanation across tickets, chat, and meetings.' },
      { name: 'Engineers', icon: 'ph-fill ph-code', tint: '#12652F',
        text: 'Understand what the task requires, why decisions were made, and what has changed without searching through several tools or relying on someone\u2019s memory.' }
    ]
  };

  componentDidMount() {
    // The stage may not be in the DOM yet at mount in this runtime, so poll for it
    // instead of early-returning, and guarantee reveal with an unconditional fallback.
    this._played = false;
    const play = () => {
      if (this._played) return;
      const n = document.querySelector('[data-qtr]');
      if (!n) return;
      this._played = true;
      n.setAttribute('data-go', '');
    };
    this._safety = setTimeout(play, 2200);

    let tries = 0;
    const attach = () => {
      const node = document.querySelector('[data-qtr]');
      if (!node) { if (++tries < 40) { this._poll = setTimeout(attach, 60); } return; }
      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) { play(); return; }
      if (!('IntersectionObserver' in window)) { play(); return; }
      this.io = new IntersectionObserver((entries) => {
        entries.forEach((e) => {
          if (e.isIntersecting) { this._t = setTimeout(play, 300); }
          else if (!this._played) { clearTimeout(this._t); }
        });
      }, { threshold: 0.12 });
      this.io.observe(node);
    };
    attach();
  }
  componentWillUnmount() {
    if (this.io) this.io.disconnect();
    clearTimeout(this._t); clearTimeout(this._poll); clearTimeout(this._safety);
  }

  renderVals() {
    const p = this.props || {}, D = this.DEMO;
    const raw = p.roles && p.roles.length ? p.roles : D.roles;

    const roles = raw.map((r, i) => ({
      name: r.name, text: r.text, icon: r.icon, tint: r.tint,
      // an accent rule at the top of each column, instead of a tinted card
      edgeStyle: 'position:absolute; left:0; right:0; top:0; height:3px; background:' + r.tint + ';'
        + (i === 0 ? ' border-radius:13px 0 0 0;' : '') + (i === raw.length - 1 ? ' border-radius:0 13px 0 0;' : ''),
      // columns of one bordered container, divided by hairline rules — no card washes
      wrapStyle: 'position:relative; min-width:0; box-sizing:border-box;'
        + ' padding:28px 24px 30px;'
        + (i > 0 ? ' border-left:1px solid #F3F4F6;' : '')
        + ' opacity:0; transform:translateY(14px); --d:' + (220 + i * 120) + 'ms;'
    }));

    var S = this.surf();

    return {
      sBg: S.bg, sInk: S.ink, sDim: S.dim, sLine: S.line, sAccent: S.accent, sCard: S.card,
      eyebrow: p.eyebrow ?? D.eyebrow,
      headline: p.headline ?? D.headline,
      roles: roles
    };
  }
}
</script>
</body>
</html>
