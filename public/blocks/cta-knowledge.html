<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="/assets/colors_and_type.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<style>
  body { margin:0; background:#1A1611; font-family:'Inter',sans-serif; }
  a { color:#C9C1F2; } a:hover { color:#C9AEF0; }
  @keyframes qck-in   { to { opacity:1; transform:translateY(0); } }
  [data-qck][data-go] [data-el="copy"] { animation:qck-in 540ms cubic-bezier(.3,0,0,1) var(--d) forwards; }
  @media (prefers-reduced-motion: reduce) {
    [data-qck] [data-el] { animation-duration:1ms !important; animation-delay:0ms !important; }
  }
</style>
</helmet>
<section style="position:relative; overflow:hidden; background:{{ sBg }}; padding:92px clamp(20px, 4vw, 40px) 100px; display:flex; justify-content:center;">
  <div style="position:absolute; top:-30%; left:16%; width:820px; height:600px; border-radius:50%; background:radial-gradient(closest-side, rgba(143,91,215,.18), rgba(143,91,215,0)); filter:blur(10px); pointer-events:none;"></div>

  <!-- offset: a brand rule holds the left edge and the whole block hangs off it -->
  <div data-qck style="position:relative; z-index:1; width:100%; max-width:980px;">

    <div style="max-width:820px; margin:0 auto; text-align:center;">
      <div data-el="copy" style="{{ eyebrowStyle }}">
        <span style="flex:none; width:20px; height:20px; background:url('/assets/quely-mark-brand.svg') center/contain no-repeat;"></span>
        <span style="min-width:0; font-family:'Geist Mono',monospace; font-size:11.5px; font-weight:700; letter-spacing:.15em; text-transform:uppercase; color:#C9C1F2; text-wrap:pretty;">{{ eyebrow }}</span>
      </div>

      <h2 data-el="copy" style="{{ headlineStyle }}">{{ headline }}</h2>
      <p data-el="copy" style="{{ bodyStyle }}">{{ body }}</p>

      <div data-el="copy" style="{{ actionsStyle }}">
        <a href="{{ primaryHref }}" style="text-decoration:none;">
          <span style="display:inline-flex; align-items:center; justify-content:center; gap:9px; background:#5C28A4; border:1px solid transparent; border-radius:8px; padding:15px 26px; font-size:15px; font-weight:700; color:#fff; box-shadow:0 24px 48px rgba(3,7,18,.18);">
            {{ primaryCta }}<i class="ph-bold ph-arrow-right" style="font-size:15px;"></i>
          </span>
        </a>
      </div>
    </div>

  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1260,&quot;height&quot;:520},&quot;eyebrow&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Project context&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;headline&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Make it easy for anyone to get up to speed without asking around.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;body&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Keep discussions, docs, meetings, and decisions around the work in one Space, so someone joining later can understand what happened, why, and where things stand without searching across tools or asking someone to explain it.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;primaryCta&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Try Quely&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;primaryHref&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;https://meetings.hubspot.com/ronma2/?utm_source=sales_enablement&amp;utm_medium=block&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  DEFAULT_SURFACE = 'ink';
  /* Surfaces are assigned by position on an assembled page, so a block must repaint
     itself rather than insist on the colour it shipped with. */
  SURFACES = {
    ink:    { bg:'#1A1611', ink:'#ECE7F2', dim:'rgba(236,231,242,.72)', line:'rgba(236,231,242,.16)', accent:'#9385E6', card:'#241F19', dark:true  },
    paper:  { bg:'#ECE7F2', ink:'#1A1611', dim:'#4B5563',               line:'#D9D2E6',               accent:'#5C28A4', card:'#FFFFFF', dark:false },
    lilac:  { bg:'#DED6F1', ink:'#1A1611', dim:'#4B5563',               line:'#C9C1E4',               accent:'#5C28A4', card:'#FFFFFF', dark:false },
    violet: { bg:'#41186F', ink:'#FFFFFF', dim:'rgba(255,255,255,.76)', line:'rgba(255,255,255,.20)', accent:'#C9C1F2', card:'#FFFFFF', dark:true  }
  };
  surf() {
    var k = (this.props && this.props.surface) || this.DEFAULT_SURFACE || 'paper';
    return this.SURFACES[k] || this.SURFACES.paper;
  }

  DEMO = {
    eyebrow: 'Project context',
    headline: 'Make it easy for anyone to get up to speed without asking around.',
    body: 'Keep discussions, docs, meetings, and decisions around the work in one Space, so someone joining later can understand what happened, why, and where things stand without searching across tools or asking someone to explain it.',
    primaryCta: 'Try Quely',
    primaryHref: 'https://meetings.hubspot.com/ronma2/?utm_source=sales_enablement&utm_medium=block',
  };

  componentDidMount() {
    const start = () => {
      const node = document.querySelector('[data-qck]');
      if (!node) { this._poll = setTimeout(start, 120); return; }
      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        node.setAttribute('data-go', ''); return;
      }
      // Imperative attribute flip drives the CSS animation (style-attribute holes do
      // not re-apply on re-render). Plays once when it first enters view.
      const play = () => { if (this._played) return; this._played = true; node.setAttribute('data-go', ''); };
      if ('IntersectionObserver' in window) {
        this.io = new IntersectionObserver((entries) => {
          entries.forEach((e) => { if (e.isIntersecting) { this._t = setTimeout(play, 240); } });
        }, { threshold: 0.2 });
        this.io.observe(node);
      }
      this._safety = setTimeout(play, 2200);
    };
    this._played = false;
    start();
  }
  componentWillUnmount() {
    if (this.io) this.io.disconnect();
    clearTimeout(this._t); clearTimeout(this._poll); clearTimeout(this._safety);
  }

  renderVals() {
    const p = this.props || {}, D = this.DEMO;
    var S = this.surf();
    return {
      sBg: S.bg, sInk: S.ink, sDim: S.dim, sLine: S.line, sAccent: S.accent, sCard: S.card,
      eyebrow: p.eyebrow ?? D.eyebrow,
      headline: p.headline ?? D.headline,
      body: p.body ?? D.body,
      primaryCta: p.primaryCta ?? D.primaryCta,
      primaryHref: p.primaryHref ?? D.primaryHref,
      eyebrowStyle: 'display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:22px;'
        + ' opacity:0; transform:translateY(10px); --d:220ms;',
      headlineStyle: 'margin:0; max-width:780px; font-size:clamp(28px, 3.4vw, 42px); line-height:1.1;'
        + ' letter-spacing:-.03em; font-weight:800; color:#fff; text-wrap:pretty; overflow-wrap:anywhere;'
        + ' opacity:0; transform:translateY(12px); --d:320ms;',
      bodyStyle: 'margin:20px 0 0; max-width:700px; font-size:17px; line-height:1.6; color:rgba(255,255,255,.66);'
        + ' text-wrap:pretty; opacity:0; transform:translateY(12px); --d:440ms;',
      actionsStyle: 'display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:12px; margin-top:34px;'
        + ' opacity:0; transform:translateY(12px); --d:560ms;'
    };
  }
}
</script>
</body>
</html>
