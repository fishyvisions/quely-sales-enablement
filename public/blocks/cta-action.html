<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="/assets/colors_and_type.css">
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<style>
  body { margin:0; background:#5C28A4; font-family:'Inter',sans-serif; }
  a { color:#fff; } a:hover { color:#E4D3F5; }
  @keyframes qca-in { to { opacity:1; transform:translateY(0); } }
  [data-qca][data-go] [data-el="copy"] { animation:qca-in 500ms cubic-bezier(.3,0,0,1) var(--d) forwards; }
  @media (prefers-reduced-motion: reduce) {
    [data-qca] [data-el] { animation-duration:1ms !important; animation-delay:0ms !important; }
  }
</style>
</helmet>
<section style="position:relative; overflow:hidden; background:#5C28A4; padding:52px clamp(20px, 4vw, 40px) 56px; display:flex; justify-content:center;">
  <div style="position:absolute; top:-60%; left:50%; width:1000px; height:520px; transform:translateX(-50%); border-radius:50%; background:radial-gradient(closest-side, rgba(255,255,255,.09), rgba(255,255,255,0)); pointer-events:none;"></div>

  <div data-qca style="position:relative; z-index:1; width:100%; max-width:1180px; display:flex; flex-direction:column; align-items:center; text-align:center; gap:22px;">

    <div data-el="copy" style="{{ copyStyle }}">
      <div style="display:flex; align-items:center; gap:10px; margin-bottom:12px;">
        <span style="flex:none; width:18px; height:18px; background:url('/assets/quely-mark-brand.svg') center/contain no-repeat; filter:brightness(0) invert(1);"></span>
        <span style="min-width:0; font-size:11px; font-weight:700; letter-spacing:.15em; text-transform:uppercase; color:rgba(255,255,255,.84); text-wrap:pretty;">{{ eyebrow }}</span>
      </div>
      <h2 style="{{ headlineStyle }}">{{ headline }}</h2>
      <p style="{{ bodyStyle }}">{{ body }}</p>
    </div>

    <div data-el="copy" style="{{ actionsStyle }}">
      <a href="{{ primaryHref }}" style="text-decoration:none;">
        <span style="display:inline-flex; align-items:center; justify-content:center; gap:9px; background:#fff; border:1px solid transparent; border-radius:8px; padding:14px 24px; font-size:15px; font-weight:700; color:#4B1F88; box-shadow:0 24px 48px rgba(3,7,18,.18);">
          {{ primaryCta }}<i class="ph-bold ph-arrow-right" style="font-size:15px;"></i>
        </span>
      </a>
    </div>
    <div style="{{ contactStyle }}">{{ contact }}</div>

  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1260,&quot;height&quot;:300}}">
class Component extends DCLogic {
  DEMO = {
    eyebrow: 'See Quely with your own work',
    headline: 'Turn discussions into clear next steps.',
    body: 'Bring a meeting, thread, or active project into Quely. See how Orbit extracts decisions, open questions, risks, action items, and next steps, then lets you schedule a follow-up meeting or push selected tasks into your project-management tool.',
    primaryCta: 'Try Quely',
    primaryHref: 'https://meetings.hubspot.com/ronma2/?utm_source=sales_enablement&utm_medium=block',
    contact: 'quely.io · ronma@quely.io'
  };

  componentDidMount() {
    const start = () => {
      const node = document.querySelector('[data-qca]');
      if (!node) { this._poll = setTimeout(start, 120); return; }
      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        node.setAttribute('data-go', ''); return;
      }
      const play = () => { if (this._played) return; this._played = true; node.setAttribute('data-go', ''); };
      if ('IntersectionObserver' in window) {
        this.io = new IntersectionObserver((entries) => {
          entries.forEach((e) => { if (e.isIntersecting) { this._t = setTimeout(play, 220); } });
        }, { threshold: 0.2 });
        this.io.observe(node);
      }
      this._safety = setTimeout(play, 2200);
    };
    this._played = false;
    start();
  }
  componentWillUnmount() {
    if (this.io) this.io.disconnect();
    clearTimeout(this._t); clearTimeout(this._poll); clearTimeout(this._safety);
  }

  renderVals() {
    const p = this.props || {}, D = this.DEMO;
    return {
      eyebrow: p.eyebrow ?? D.eyebrow,
      headline: p.headline ?? D.headline,
      body: p.body ?? D.body,
      primaryCta: p.primaryCta ?? D.primaryCta,
      primaryHref: p.primaryHref ?? D.primaryHref,
      contact: p.contact ?? D.contact,

      copyStyle: 'max-width:760px; text-align:center; opacity:0; transform:translateY(10px); --d:100ms;',
      headlineStyle: 'margin:0; max-width:660px; font-size:clamp(24px, 2.4vw, 30px); line-height:1.16;'
        + ' letter-spacing:-.022em; font-weight:700; color:#fff; text-wrap:pretty; overflow-wrap:anywhere;',
      bodyStyle: 'margin:12px 0 0; max-width:660px; font-size:15px; line-height:1.6; color:rgba(255,255,255,.8);'
        + ' text-wrap:pretty;',
      contactStyle: 'margin-top:26px; font-size:14px; color:rgba(255,255,255,.72);',
      actionsStyle: 'display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:11px;'
        + ' opacity:0; transform:translateY(10px); --d:240ms;'
    };
  }
}
</script>
</body>
</html>
