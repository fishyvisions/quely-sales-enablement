<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="/assets/colors_and_type.css">
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<style>
  body { margin:0; background:#FFFFFF; font-family:'Inter',sans-serif; }
  a { color:#5C28A4; } a:hover { color:#4B1F88; }

  /* The 6-col bento holds down to ~860px viewport (stage 780, span-2 = 249px).
     Below that the spans halve so some variety survives, then stack. */
  @media (max-width: 860px) {
    [data-qsp] { grid-template-columns:repeat(2, minmax(0,1fr)) !important; }
    [data-qsp] [data-card] { grid-column:span 1 !important; }
    [data-qsp] [data-card][data-wide] { grid-column:1 / -1 !important; }
  }
  @media (max-width: 620px) {
    [data-qsp] { grid-template-columns:1fr !important; }
    [data-qsp] [data-card] { grid-column:1 / -1 !important; }
  }

  @keyframes qsp-in { to { opacity:1; transform:translateY(0); } }
  [data-qsp][data-go] [data-el="card"] { animation:qsp-in 480ms cubic-bezier(.3,0,0,1) var(--d) forwards; }
  [data-qsp] [data-card] { transition:transform 200ms cubic-bezier(.2,0,0,1), box-shadow 200ms cubic-bezier(.2,0,0,1), border-color 200ms cubic-bezier(.2,0,0,1); }
  [data-qsp] [data-card]:hover { transform:translateY(-3px); box-shadow:0 16px 32px -14px rgba(3,7,18,.20); }
  @media (prefers-reduced-motion: reduce) {
    [data-qsp] [data-el] { animation-duration:1ms !important; animation-delay:0ms !important; }
  }
</style>
</helmet>
<section style="position:relative; overflow:hidden; background:#FFFFFF; padding:80px 40px; display:flex; justify-content:center;">

  <div style="position:relative; z-index:1; width:100%; max-width:1180px;">

    <div style="max-width:840px; margin:0 auto; text-align:center;">
      <div style="display:inline-flex; align-items:center; gap:9px; margin-bottom:14px;">
        <span style="flex:none; width:18px; height:18px; background:url('/assets/quely-mark-brand.svg') center/contain no-repeat;"></span>
        <span style="font-size:12px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:#7C3AED;">{{ eyebrow }}</span>
      </div>
      <h2 style="margin:0 0 14px; font-size:32px; line-height:1.15; letter-spacing:-.022em; font-weight:700; color:#111827; text-wrap:pretty;">{{ headline }}</h2>
      <p style="margin:0; font-size:16px; line-height:1.6; color:#4B5563; text-wrap:pretty;">{{ body }}</p>
    </div>

    <!-- ============ THE BENTO ============ -->
    <div data-qsp style="margin-top:32px; display:grid; grid-template-columns:repeat(6, minmax(0,1fr)); gap:16px;">

      <sc-for list="{{ cards }}" as="c" hint-placeholder-count="7">
        <div data-el="card" data-card data-wide="{{ c.wide }}" style="{{ c.wrapStyle }}">
          <div style="display:flex; align-items:center; gap:11px; margin-bottom:12px;">
            <span style="{{ c.markStyle }}"><i class="{{ c.icon }}" style="font-size:17px;"></i></span>
            <span style="flex:1; min-width:0; font-size:16px; line-height:1.3; font-weight:700; letter-spacing:-.012em; color:#111827; text-wrap:pretty;">{{ c.title }}</span>
          </div>

          <p style="margin:0; font-size:13.5px; line-height:1.55; color:#4B5563; text-wrap:pretty;">{{ c.text }}</p>

          <sc-if value="{{ c.note }}" hint-placeholder-val="{{ false }}">
            <p style="margin:10px 0 0; font-size:12px; line-height:1.5; color:#6B7280; text-wrap:pretty;">{{ c.note }}</p>
          </sc-if>

          <!-- ORBIT ESTIMATE -->
          <sc-if value="{{ c.showEstimate }}" hint-placeholder-val="{{ false }}">
            <div style="margin-top:14px; background:#F9F6FE; border:1px solid #EADDF8; border-radius:11px; padding:12px 13px;">
              <div style="display:flex; align-items:center; flex-wrap:wrap; gap:9px;">
                <span style="flex:none; width:18px; height:18px; background:url('/assets/quely-orbit-mascot.png') center/contain no-repeat;"></span>
                <span style="flex:1 1 auto; min-width:0; font-size:12px; font-weight:700; color:#4B1F88;">{{ estimateLabel }}</span>
                <span style="flex:none; background:#5C28A4; border-radius:8px; padding:4px 11px; font-size:13px; font-weight:700; color:#fff;">{{ estimateValue }}</span>
              </div>
              <div style="display:flex; flex-wrap:wrap; gap:6px; margin-top:11px;">
                <sc-for list="{{ subtasks }}" as="st" hint-placeholder-count="3">
                  <span style="display:inline-flex; align-items:center; gap:6px; white-space:nowrap; background:#fff; border:1px solid #E4D3F5; border-radius:9999px; padding:4px 10px; font-size:11px; font-weight:600; color:#4B1F88;"><i class="ph ph-check-square" style="font-size:11px;"></i>{{ st }}</span>
                </sc-for>
              </div>
            </div>
          </sc-if>

          <!-- FIBONACCI -->
          <sc-if value="{{ c.showFib }}" hint-placeholder-val="{{ false }}">
            <div style="display:flex; flex-wrap:wrap; gap:6px; margin-top:14px;">
              <sc-for list="{{ fib }}" as="f" hint-placeholder-count="6">
                <span style="{{ f.style }}">{{ f.n }}</span>
              </sc-for>
            </div>
          </sc-if>

          <!-- TOOLS -->
          <sc-if value="{{ c.showTools }}" hint-placeholder-val="{{ false }}">
            <div style="display:flex; flex-wrap:wrap; align-items:center; gap:9px; margin-top:14px;">
              <sc-for list="{{ tools }}" as="t" hint-placeholder-count="8">
                <span style="{{ t.style }}"></span>
              </sc-for>
            </div>
          </sc-if>

          <!-- CAPACITY -->
          <sc-if value="{{ c.showCapacity }}" hint-placeholder-val="{{ false }}">
            <div style="display:flex; flex-direction:column; gap:9px; margin-top:14px;">
              <sc-for list="{{ capacity }}" as="cp" hint-placeholder-count="3">
                <div style="display:flex; align-items:center; gap:9px;">
                  <span style="{{ cp.avatarStyle }}">{{ cp.initials }}</span>
                  <span style="flex:1 1 auto; min-width:0; font-size:12px; font-weight:600; color:#111827; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">{{ cp.name }}</span>
                  <span style="flex:1 1 60px; min-width:36px; height:7px; border-radius:9999px; background:#EEF0F4; overflow:hidden;"><span style="{{ cp.barStyle }}"></span></span>
                  <span style="flex:none; font-size:11.5px; font-weight:600; color:{{ cp.labelColor }}; white-space:nowrap;">{{ cp.label }}</span>
                </div>
              </sc-for>
            </div>
          </sc-if>

          <!-- TIMER -->
          <sc-if value="{{ c.showTimer }}" hint-placeholder-val="{{ false }}">
            <div style="display:inline-flex; align-items:center; gap:9px; margin-top:14px; background:#EFEAFB; border-radius:9px; padding:7px 12px;">
              <i class="ph-fill ph-timer" style="font-size:15px; color:#5C28A4;"></i>
              <span style="font-size:13px; font-weight:700; letter-spacing:.09em; color:#5C28A4; font-variant-numeric:tabular-nums;">{{ timerValue }}</span>
              <span style="font-size:11.5px; font-weight:600; color:#4B1F88;">{{ timerLabel }}</span>
            </div>
          </sc-if>

          <!-- MEETING -->
          <sc-if value="{{ c.showMeeting }}" hint-placeholder-val="{{ false }}">
            <div style="display:flex; flex-direction:column; gap:6px; margin-top:14px;">
              <span style="display:inline-flex; align-items:center; gap:7px; background:#fff; border:1px solid #E5E7EB; border-radius:9px; padding:6px 11px; font-size:12px; font-weight:600; color:#374151;"><i class="ph-fill ph-calendar-plus" style="flex:none; font-size:13px; color:#B45309;"></i>{{ meetSchedule }}</span>
              <i class="ph-bold ph-arrow-down" style="font-size:12px; color:#4B5563; padding-left:13px;"></i>
              <span style="display:inline-flex; align-items:center; gap:7px; background:#fff; border:1px solid #E5E7EB; border-radius:9px; padding:6px 11px; font-size:12px; font-weight:600; color:#374151;"><i class="ph-fill ph-microphone-stage" style="flex:none; font-size:13px; color:#B45309;"></i>{{ meetTranscript }}</span>
            </div>
          </sc-if>

          <!-- DOCS -->
          <sc-if value="{{ c.showDocs }}" hint-placeholder-val="{{ false }}">
            <div style="display:flex; flex-wrap:wrap; gap:8px; margin-top:14px;">
              <sc-for list="{{ docs }}" as="d" hint-placeholder-count="3">
                <span style="display:inline-flex; align-items:center; gap:7px; white-space:nowrap; background:#fff; border:1px solid #E5E7EB; border-radius:9px; padding:6px 11px; font-size:12px; font-weight:600; color:#374151;"><i class="{{ d.icon }}" style="font-size:13px; color:{{ d.tint }};"></i>{{ d.name }}</span>
              </sc-for>
            </div>
          </sc-if>
        </div>
      </sc-for>

    </div>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1260,&quot;height&quot;:1180}}">
class Component extends DCLogic {
  DEMO = {
    eyebrow: 'One searchable space for the sprint',
    headline: 'Plan, commit, and run the sprint with the full history behind every decision.',
    body: 'Review the work, debate estimates, uncover blind spots, assign tasks against actual availability, and keep every decision connected to the sprint. Orbit makes it easy to retrieve why a task received its estimate, what changed, who owns it, and where capacity is tight before the team commits.',

    // span = grid columns out of 6, so the bento has rhythm rather than a uniform grid
    cards: [
      { span: 3, icon: 'ph-fill ph-sparkle', tint: '#5C28A4', wash: '#F7F3FD', edge: '#E4D3F5',
        title: 'Let Orbit estimate the work',
        text: 'Orbit, Quely’s AI assistant, reviews the information around a task and suggests an estimate. It can break the work into subtasks, show how the effort may differ by experience level, and raise questions that help the team spot missing requirements, unclear scope, or unresolved dependencies before committing.',
        showEstimate: true },

      { span: 3, icon: 'ph-fill ph-cards', tint: '#2563EB', wash: '#F3F8FF', edge: '#DBEAFE',
        title: 'Estimate together and preserve the reasoning',
        text: 'Run Fibonacci estimation with the team, compare individual estimates, and discuss why they differ. The final estimate stays connected to the assumptions and conversation behind it, so anyone can later understand why the team chose that number.',
        showFib: true },

      { span: 3, icon: 'ph-fill ph-chats-circle', tint: '#0E7490', wash: '#F2FDFE', edge: '#CFF3F8',
        title: 'Discuss the sprint asynchronously',
        text: 'Use the Space chat to discuss the sprint or any task inside it. Team members can ask questions, explain their estimates, raise risks, and share updates without moving the conversation into a separate chat tool. Set a timer to give everyone a clear window to contribute before the discussion closes.',
        showTimer: true },

      { span: 3, icon: 'ph-fill ph-plugs-connected', tint: '#4F46E5', wash: '#F4F5FF', edge: '#DDE1FD',
        title: 'Bring in the work the sprint depends on',
        text: 'Import relevant work items from Jira, Linear, Azure DevOps, GitHub Issues, Monday.com, Trello, Wrike, and other connected project-management tools. Select work by status and other fields, then bring the right items into the Sprint Space without recreating them.',
        showTools: true },

      { span: 2, icon: 'ph-fill ph-flow-arrow', tint: '#B91C1C', wash: '#FFF5F5', edge: '#FBD5D5',
        title: 'Explain the work with quick documents and diagrams',
        text: 'Create lightweight documents and diagrams inside the Space when a task needs more explanation than the ticket provides. Capture requirements, technical flows, architecture ideas, edge cases, or implementation notes and keep them connected to the sprint work they support.',
        showDocs: true },

      { span: 2, icon: 'ph-fill ph-microphone-stage', tint: '#B45309', wash: '#FFFCF0', edge: '#FBE7BC',
        title: 'Move from async discussion to a meeting',
        text: 'When a thread needs a live conversation, schedule the meeting from the Sprint Space. Quely records and transcribes it, then returns the transcript to the same Space, so the decisions, questions, and next steps remain connected to the sprint.',
        showMeeting: true },

      { span: 2, icon: 'ph-fill ph-gauge', tint: '#15803D', wash: '#F4FDF7', edge: '#C6EFD5',
        title: 'Assign work against real availability',
        text: 'Have each person set the time they have available for the sprint, then assign the work in the same Space. The lead can allocate tasks, or the team can take turns choosing work, while Quely shows who still has capacity, who is fully allocated, and where the workload needs to be adjusted before commitment.',
        showCapacity: true }
    ],

    estimateLabel: 'Orbit suggests',
    estimateValue: '5 pts',
    subtasks: ['Tokenization', 'Card flow', 'QA pass'],
    fib: ['1', '2', '3', '5', '8', '13'],
    fibPicked: '5',
    timerValue: '04:00:00',
    timerLabel: 'left to contribute',
    tools: [
      '/assets/logos/jira.svg', '/assets/logos/linear.svg', '/assets/logos/azuredevops.svg',
      '/assets/logos/github.svg', '/assets/logos/monday.svg', '/assets/logos/trello.svg',
      '/assets/logos/wrike.png', '/assets/logos/todoist.svg'
    ],
    docs: [
      { name: 'Requirements', icon: 'ph-fill ph-file-text', tint: '#2563EB' },
      { name: 'Technical flow', icon: 'ph-fill ph-flow-arrow', tint: '#B91C1C' },
      { name: 'Edge cases', icon: 'ph-fill ph-list-checks', tint: '#4F46E5' }
    ],
    meetSchedule: 'Schedule from the Space',
    meetTranscript: 'Transcript returns here',
    capacity: [
      { name: 'Dana', initials: 'DR', tint: '#5C28A4', pct: 100, label: 'Full' },
      { name: 'Ravi', initials: 'RS', tint: '#2563EB', pct: 62,  label: 'Room' },
      { name: 'Mei',  initials: 'ML', tint: '#15803D', pct: 128, label: 'Over' }
    ]
  };

  logoMark(src, px) {
    return 'flex:none; width:' + px + 'px; height:' + px + 'px;'
      + ' background:url(\'' + src + '\') center/contain no-repeat;';
  }

  componentDidMount() {
    // The stage may not be in the DOM yet at mount in this runtime, so poll for it
    // instead of early-returning, and guarantee reveal with an unconditional fallback.
    this._played = false;
    const play = () => {
      if (this._played) return;
      const n = document.querySelector('[data-qsp]');
      if (!n) return;
      this._played = true;
      n.setAttribute('data-go', '');
    };
    this._safety = setTimeout(play, 2200);

    let tries = 0;
    const attach = () => {
      const node = document.querySelector('[data-qsp]');
      if (!node) { if (++tries < 40) { this._poll = setTimeout(attach, 60); } return; }
      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) { play(); return; }
      if (!('IntersectionObserver' in window)) { play(); return; }
      this.io = new IntersectionObserver((entries) => {
        entries.forEach((e) => {
          if (e.isIntersecting) { this._t = setTimeout(play, 300); }
          else if (!this._played) { clearTimeout(this._t); }
        });
      }, { threshold: 0.1 });
      this.io.observe(node);
    };
    attach();
  }
  componentWillUnmount() {
    if (this.io) this.io.disconnect();
    clearTimeout(this._t); clearTimeout(this._poll); clearTimeout(this._safety);
  }

  renderVals() {
    const p = this.props || {}, D = this.DEMO;

    const cards = (p.cards && p.cards.length ? p.cards : D.cards).map((c, i) => ({
      title: c.title, text: c.text, note: c.note || '', icon: c.icon,
      showEstimate: !!c.showEstimate, showFib: !!c.showFib, showTools: !!c.showTools,
      showCapacity: !!c.showCapacity, showTimer: !!c.showTimer,
      showMeeting: !!c.showMeeting, showDocs: !!c.showDocs,
      // the wider authored cards keep a full row at the 2-col step
      wide: c.span >= 3 ? '' : null,
      // each card carries its own tint as a solid icon tile on its own wash, so the
      // set reads as a coloured bento rather than seven identical white cards
      markStyle: 'flex:none; display:inline-flex; align-items:center; justify-content:center;'
        + ' width:34px; height:34px; border-radius:10px; background:' + c.tint + '; color:#fff;',
      // grid-column spans give the bento its rhythm; the @media rules above drop
      // every card to a full row before these spans can crush their contents
      wrapStyle: 'grid-column:span ' + c.span + '; box-sizing:border-box; background:' + c.wash + ';'
        + ' border:1px solid ' + c.edge + '; border-radius:14px;'
        + ' padding:20px 22px; opacity:0; transform:translateY(12px); --d:' + (200 + i * 90) + 'ms;'
    }));

    const fibPicked = p.fibPicked ?? D.fibPicked;
    const fib = (p.fib && p.fib.length ? p.fib : D.fib).map((n) => ({
      n: n,
      style: 'display:inline-flex; align-items:center; justify-content:center; width:34px; height:38px;'
        + ' border-radius:8px; font-size:14px; font-weight:700;'
        + (n === fibPicked
            ? ' background:#5C28A4; color:#fff; box-shadow:0 1px 2px rgba(3,7,18,.10);'
            : ' background:#fff; border:1px solid #E5E7EB; color:#374151;')
    }));

    const capacity = (p.capacity && p.capacity.length ? p.capacity : D.capacity).map((cp) => {
      const over = cp.pct > 100;
      const near = !over && cp.pct >= 95;
      return {
        name: cp.name, initials: cp.initials, label: cp.label,
        avatarStyle: 'flex:none; width:26px; height:26px; border-radius:50%; background:' + cp.tint
          + '; color:#fff; font-size:11px; font-weight:700; display:inline-flex;'
          + ' align-items:center; justify-content:center;',
        barStyle: 'display:block; height:100%; width:' + Math.min(100, cp.pct) + '%;'
          + ' border-radius:9999px; background:' + (over ? '#EF4444' : near ? '#B45309' : '#5C28A4') + ';',
        labelColor: over ? '#B91C1C' : near ? '#B45309' : '#4B5563'
      };
    });

    return {
      eyebrow: p.eyebrow ?? D.eyebrow,
      headline: p.headline ?? D.headline,
      body: p.body ?? D.body,
      cards: cards,
      estimateLabel: p.estimateLabel ?? D.estimateLabel,
      estimateValue: p.estimateValue ?? D.estimateValue,
      subtasks: p.subtasks && p.subtasks.length ? p.subtasks : D.subtasks,
      fib: fib,
      timerValue: p.timerValue ?? D.timerValue,
      timerLabel: p.timerLabel ?? D.timerLabel,
      tools: (p.tools && p.tools.length ? p.tools : D.tools).map((src) => ({ style: this.logoMark(src, 22) })),
      docs: p.docs && p.docs.length ? p.docs : D.docs,
      meetSchedule: p.meetSchedule ?? D.meetSchedule,
      meetTranscript: p.meetTranscript ?? D.meetTranscript,
      capacity: capacity
    };
  }
}
</script>
</body>
</html>
