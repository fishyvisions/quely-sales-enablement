<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="/assets/colors_and_type.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<style>
  body { margin:0; background:#1A1611; font-family:'Inter',sans-serif; }
  a { color:#C9C1F2; } a:hover { color:#C9AEF0; }
  @keyframes qhalo { 0%,100% { opacity:.5; } 50% { opacity:.78; } }
  @keyframes qrise { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-8px); } }
  @keyframes qbob { 0%,100% { transform:translateY(0); } 50% { transform:translateY(6px); } }
  @keyframes qorbit { to { transform:rotate(360deg); } }
</style>
</helmet>
<div style="{{ shellStyle }}">
  <div style="position:absolute; inset:0; z-index:0; pointer-events:none; opacity:.35; background-image:radial-gradient(rgba(255,255,255,0.07) 1px, transparent 1px); background-size:26px 26px;"></div>
  <div style="position:relative; z-index:1; width:100%; max-width:1040px; display:flex; flex-direction:column; align-items:center; text-align:center;">

    <div style="width:100%; display:flex; align-items:center; justify-content:space-between; gap:16px; padding-bottom:22px; border-bottom:2px solid rgba(255,255,255,.14); margin-bottom:56px;">
      <img src="/assets/quely-logo-dark.svg" alt="Quely" style="height:26px;">
      <span style="font-family:'Geist Mono',monospace; font-size:11.5px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:#C9C1F2; text-align:right;">{{ eyebrowText }}</span>
    </div>
    <h1 style="margin:0; max-width:880px; font-family:'Geist',sans-serif; font-size:58px; line-height:1.04; letter-spacing:-.04em; font-weight:800; color:{{ sInk }};">{{ headlineText }}</h1>
    <p style="margin:24px 0 0; max-width:730px; font-size:18px; line-height:1.6; color:{{ sDim }}; text-wrap:pretty;">{{ bodyText }}</p>

    <!-- THREE TIERS: answers in front (crisp, dominant) -> Orbit -> the Space behind (small, dim) -->
    <div style="position:relative; width:100%; max-width:820px; margin-top:60px; display:flex; flex-direction:column; align-items:center;">


      <!-- TIER 1 — the answer you came for, dominant -->
      <div style="position:relative; z-index:3; width:100%; max-width:640px; display:flex; flex-direction:column; gap:11px; animation:qrise 8s ease-in-out infinite;">
        <div style="display:flex; align-items:center; gap:10px; align-self:flex-start; max-width:100%; padding:9px 15px 9px 12px; border-radius:9999px; background:rgba(255,255,255,.07); border:1.5px solid #C9C1F2;">
          <i class="ph-bold ph-magnifying-glass" style="flex:none; font-size:14px; color:#C9AEF0;"></i>
          <span style="font-size:14px; font-weight:600; color:#F0EAFA; text-align:left;">{{ questionText }}</span>
          <span style="flex:none; font-size:11px; font-weight:600; color:rgba(255,255,255,.62);">{{ latencyText }}</span>
        </div>

        <div style="background:#fff; border:2px solid #1A1611; border-radius:10px; padding:22px 24px 18px; text-align:left; box-shadow:8px 8px 0 #5C28A4;">
          <div style="display:flex; align-items:center; gap:9px; margin-bottom:11px;">
            <span style="flex:none; width:26px; height:26px; border-radius:8px; background:#ECFDF5; color:#12652F; display:inline-flex; align-items:center; justify-content:center;"><i class="ph-fill ph-seal-check" style="font-size:15px;"></i></span>
            <span style="font-size:10px; font-weight:800; letter-spacing:.11em; text-transform:uppercase; color:#12652F;">{{ primaryLabel }}</span>
          </div>
          <div style="font-size:20px; line-height:1.35; font-weight:700; letter-spacing:-.015em; color:#1A1611; text-wrap:pretty;">{{ primaryText }}</div>
          <div style="margin-top:15px; padding-top:13px; border-top:1px solid #F3F4F6; display:flex; align-items:center; gap:7px;">
            <i class="ph-fill ph-microphone-stage" style="font-size:13px; color:#5C28A4;"></i>
            <span style="font-size:12px; font-weight:500; color:#5C5345;">{{ provenanceText }}</span>
          </div>
        </div>

        <div style="display:flex; gap:11px; align-items:stretch;">
          <sc-for list="{{ secondary }}" as="s" hint-placeholder-count="3">
            <div style="flex:1; min-width:0; background:#F8F5FB; border:2px solid #C9C1F2; border-radius:10px; padding:14px 15px; text-align:left; box-shadow:5px 5px 0 #5C28A4;">
              <div style="display:flex; align-items:center; gap:6px; margin-bottom:7px;">
                <i class="{{ s.icon }}" style="font-size:13px; color:#5C28A4;"></i>
                <span style="font-size:9px; font-weight:800; letter-spacing:.11em; text-transform:uppercase; color:#5C5345;">{{ s.label }}</span>
              </div>
              <div style="font-size:13px; line-height:1.45; font-weight:500; color:#374151; text-wrap:pretty;">{{ s.text }}</div>
            </div>
          </sc-for>
        </div>
      </div>

      <div style="position:relative; z-index:2; width:1px; height:34px; background:linear-gradient(180deg, rgba(171,132,225,0), rgba(171,132,225,.55));"></div>

      <!-- TIER 2 — Orbit, the synthesis point (brand mark: gradient orbit ring + mascot disc) -->
      <div style="position:relative; z-index:2; display:inline-flex; align-items:center; gap:14px;">
        <span style="position:relative; flex:none; width:104px; height:104px; display:inline-flex; align-items:center; justify-content:center;">
          <svg viewBox="0 0 400 400" aria-hidden="true" style="position:absolute; inset:0; width:100%; height:100%; animation:qorbit 46s linear infinite;">
            <g fill="#9385E6" opacity=".5">
              <ellipse cx="200" cy="80" rx="17" ry="40"></ellipse>
              <ellipse cx="200" cy="320" rx="17" ry="40"></ellipse>
              <ellipse cx="80" cy="200" rx="40" ry="17"></ellipse>
              <ellipse cx="320" cy="200" rx="40" ry="17"></ellipse>
              <ellipse cx="115" cy="115" rx="17" ry="40" transform="rotate(45 115 115)"></ellipse>
              <ellipse cx="285" cy="285" rx="17" ry="40" transform="rotate(45 285 285)"></ellipse>
              <ellipse cx="285" cy="115" rx="17" ry="40" transform="rotate(-45 285 115)"></ellipse>
              <ellipse cx="115" cy="285" rx="17" ry="40" transform="rotate(-45 115 285)"></ellipse>
            </g>
          </svg>
          <img src="/assets/quely-orbit-pet.png" alt="Orbit" style="position:relative; z-index:1; width:66px; height:auto; filter:drop-shadow(0 0 24px rgba(143,91,215,.85)); animation:qbob 5s ease-in-out infinite;">
        </span>
        <span style="display:inline-flex; align-items:center; gap:7px; font-size:16px; font-weight:700; color:#F0EAFA; letter-spacing:-.01em;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="#C9C1F2" aria-hidden="true" style="flex:none;"><path d="M12 2l1.6 6.4L20 10l-6.4 1.6L12 18l-1.6-6.4L4 10l6.4-1.6L12 2z"></path></svg>{{ orbitLabel }}
        </span>
      </div>

      <div style="position:relative; z-index:2; width:1px; height:34px; background:linear-gradient(180deg, rgba(171,132,225,.55), rgba(171,132,225,.16));"></div>

      <!-- TIER 3 — the Space: the material, further back so it reads as foundation -->
      <div style="position:relative; z-index:1; display:flex; gap:9px; justify-content:center; opacity:.62;">
        <sc-for list="{{ sources }}" as="s" hint-placeholder-count="3">
          <div style="flex:0 0 168px; box-sizing:border-box; padding:10px 12px; border-radius:8px; background:rgba(255,255,255,.05); border:1.5px solid rgba(201,193,242,.45); text-align:left;">
            <div style="display:flex; align-items:center; gap:6px;">
              <i class="{{ s.icon }}" style="font-size:13px; color:rgba(201,174,240,.9);"></i>
              <span style="font-size:12px; font-weight:600; color:rgba(255,255,255,.82);">{{ s.title }}</span>
            </div>
            <div style="margin-top:3px; font-size:11px; color:rgba(255,255,255,.62);">{{ s.meta }}</div>
          </div>
        </sc-for>
      </div>

    </div>

    <sc-if value="{{ showScrollCue }}" hint-placeholder-val="{{ true }}">
      <div style="margin-top:48px; display:flex; flex-direction:column; align-items:center; gap:8px; font-size:15px; color:rgba(255,255,255,.62); animation:qbob 2.4s ease-in-out infinite;"><span>Scroll to explore</span><i class="ph ph-arrow-down" style="font-size:20px;"></i></div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1240,&quot;height&quot;:1200},&quot;eyebrow&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;One searchable history for every piece of work&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;headline&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Find what was decided and why in minutes.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;body&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Quely gives every task a Space where your team can discuss the work, make decisions, and move from async discussion to a live meeting when needed. Quely’s AI assistant, Orbit, makes it easy to retrieve what was decided, why, the trade-offs considered, and who owns the next step.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;question&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Why did we ship polling instead of WebSockets?&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;latency&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;4s&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;primaryLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Decided&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;primaryText&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Ship 30-second polling for V1 and defer WebSockets to Q3.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;provenance&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Infra review · Mar 14 · Priya, Marcus, Elena&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;orbitLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Orbit&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;showScrollCue&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Layout&quot;},&quot;embedded&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Layout&quot;},&quot;secondary&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Array&lt;{label:string;icon:string;text:string}&gt;&quot;},&quot;sources&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Array&lt;{icon:string;title:string;meta:string}&gt;&quot;}}">
class Component extends DCLogic {
  /* Surfaces are assigned by position on an assembled page, so a block must repaint
     itself rather than insist on the colour it shipped with. */
  SURFACES = {
    ink:    { bg:'#1A1611', ink:'#ECE7F2', dim:'rgba(236,231,242,.72)', line:'rgba(236,231,242,.16)', accent:'#9385E6', card:'#241F19', dark:true  },
    paper:  { bg:'#ECE7F2', ink:'#1A1611', dim:'#4B5563',               line:'#D9D2E6',               accent:'#5C28A4', card:'#FFFFFF', dark:false },
    lilac:  { bg:'#DED6F1', ink:'#1A1611', dim:'#4B5563',               line:'#C9C1E4',               accent:'#5C28A4', card:'#FFFFFF', dark:false },
    violet: { bg:'#41186F', ink:'#FFFFFF', dim:'rgba(255,255,255,.76)', line:'rgba(255,255,255,.20)', accent:'#C9C1F2', card:'#FFFFFF', dark:true  }
  };
  DEFAULT_SURFACE = 'ink';
  surf() {
    var k = (this.props && this.props.surface) || this.DEFAULT_SURFACE || 'paper';
    return this.SURFACES[k] || this.SURFACES.paper;
  }

  DEFAULT_SECONDARY = [
    { label:'Why',       icon:'ph-fill ph-lightbulb',   text:'A gateway project would have added three weeks and ~4\u00d7 infra cost.' },
    { label:'Trade-off', icon:'ph-fill ph-scales',      text:'30s of delay accepted to ship five weeks sooner.' },
    { label:'Next step', icon:'ph-fill ph-arrow-right', text:'Scope the Q3 gateway work \u2014 Marcus.' }
  ];

  DEFAULT_SOURCES = [
    { icon:'ph-fill ph-chats-circle',     title:'Async discussion', meta:'24 messages on the task' },
    { icon:'ph-fill ph-microphone-stage', title:'Meeting recording', meta:'38 min, transcribed' },
    { icon:'ph-fill ph-file-text',        title:'Documents',        meta:'PRD, specs, designs' }
  ];

  renderVals() {
    const embedded = !!this.props.embedded;
    var S = this.surf();
    return {
      sBg: S.bg, sInk: S.ink, sDim: S.dim, sLine: S.line, sAccent: S.accent, sCard: S.card,
      shellStyle: (embedded ? 'padding:0 40px 8px;' : 'background:' + this.surf().bg + '; padding:64px 40px 84px;')
        + " position:relative; overflow:hidden; display:flex; justify-content:center; font-family:'Inter',sans-serif;",
      showScrollCue: this.props.showScrollCue !== false,
      eyebrowText: this.props.eyebrow ?? 'One searchable history for every piece of work',
      headlineText: this.props.headline ?? 'Find what was decided and why in minutes.',
      bodyText: this.props.body ?? 'Quely gives every task a Space where your team can discuss the work, make decisions, and move from async discussion to a live meeting when needed. Quely\u2019s AI assistant, Orbit, makes it easy to retrieve what was decided, why, the trade-offs considered, and who owns the next step.',
      primaryLabel: this.props.primaryLabel ?? 'Decided',
      primaryText: this.props.primaryText ?? 'Ship 30-second polling for V1 and defer WebSockets to Q3.',
      orbitLabel: this.props.orbitLabel ?? 'Orbit',
      questionText: this.props.question ?? 'Why did we ship polling instead of WebSockets?',
      latencyText: this.props.latency ?? '4s',
      provenanceText: this.props.provenance ?? 'Infra review \u00b7 Mar 14 \u00b7 Priya, Marcus, Elena',

      secondary: (this.props.secondary && this.props.secondary.length) ? this.props.secondary : this.DEFAULT_SECONDARY,
      sources: (this.props.sources && this.props.sources.length) ? this.props.sources : this.DEFAULT_SOURCES
    };
  }
}
</script>
</body>
</html>
