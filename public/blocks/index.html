<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quely Content Blocks</title>
<style>
  :root { --bg:#0A0518; --panel:#160B2E; --line:#2A1C4A; --ink:#F4F1FB; --muted:#AB97D4; --accent:#8F5BD7; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:'Inter',system-ui,sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:56px 32px 28px; max-width:1120px; margin:0 auto; }
  .eyebrow { font-size:12px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); margin:0 0 12px; }
  h1 { margin:0; font-size:34px; letter-spacing:-.02em; font-weight:800; }
  .sub { margin:12px 0 0; color:var(--muted); font-size:15px; line-height:1.6; max-width:640px; }
  main { max-width:1120px; margin:0 auto; padding:16px 32px 72px; }
  .group { margin-top:36px; }
  .group h2 { font-size:13px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin:0 0 14px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(240px,1fr)); gap:14px; }
  a.card { display:flex; align-items:center; gap:12px; text-decoration:none; color:var(--ink);
    background:var(--panel); border:1px solid var(--line); border-radius:13px; padding:16px 18px;
    transition:transform .16s ease, border-color .16s ease, box-shadow .16s ease; }
  a.card:hover { transform:translateY(-2px); border-color:var(--accent); box-shadow:0 16px 34px -18px rgba(143,91,215,.6); }
  .dot { flex:none; width:34px; height:34px; border-radius:9px; display:inline-flex; align-items:center; justify-content:center;
    font-size:17px; background:rgba(143,91,215,.16); border:1px solid rgba(143,91,215,.34); }
  .card .name { font-size:14.5px; font-weight:650; line-height:1.25; }
  .card .file { font-size:11.5px; color:var(--muted); margin-top:2px; }
  footer { max-width:1120px; margin:0 auto; padding:0 32px 56px; color:var(--muted); font-size:13px; }
</style>
</head>
<body>
<header>
  <p class="eyebrow">Quely Sales Enablement</p>
  <h1>Content Blocks</h1>
  <p class="sub">The 20 reusable content sections from the design handoff, rebuilt as live pages. Click any block to open it full-screen.</p>
</header>
<main>
  <div class="group">
    <h2>Heroes</h2>
    <div class="grid" id="g-hero"></div>
  </div>
  <div class="group">
    <h2>Content sections</h2>
    <div class="grid" id="g-content"></div>
  </div>
  <div class="group">
    <h2>Calls to action</h2>
    <div class="grid" id="g-cta"></div>
  </div>
</main>
<footer>20 blocks · rendered live from the Quely design system.</footer>
<script>
  const BLOCKS = {
    hero: [
      ['hero-collision', 'Hero — Collision', '💥'],
      ['hero-thread', 'Hero — Thread', '🧵'],
      ['hero-bottleneck', 'Hero — Bottleneck', '⏳'],
      ['hero-handoff', 'Hero — Handoff', '🤝'],
    ],
    content: [
      ['space-anatomy', 'Space Anatomy', '🧬'],
      ['orbit-lenses', 'Orbit Lenses', '🔭'],
      ['relationship-map', 'Relationship Map', '🕸️'],
      ['multi-tool-space', 'Multi-Tool Space', '🧰'],
      ['before-after', 'Before / After', '↔️'],
      ['how-it-works', 'How It Works', '⚙️'],
      ['decision-record', 'Decision Record', '📜'],
      ['space-converge', 'Space Converge', '🎯'],
      ['sprint-planning', 'Sprint Planning', '📋'],
      ['sprint-review', 'Sprint Review', '✅'],
      ['team-roles', 'Team Roles', '👥'],
    ],
    cta: [
      ['cta-fragmentation', 'CTA — Fragmentation', '🧩'],
      ['cta-decisions', 'CTA — Decisions', '🧭'],
      ['cta-risks', 'CTA — Risks', '⚠️'],
      ['cta-knowledge', 'CTA — Knowledge', '📚'],
      ['cta-action', 'CTA — Action', '🚀'],
    ],
  };
  function render(key, id) {
    const el = document.getElementById(id);
    el.innerHTML = BLOCKS[key].map(([slug, name, icon]) =>
      '<a class="card" href="./' + slug + '.html">' +
        '<span class="dot">' + icon + '</span>' +
        '<span><span class="name">' + name + '</span>' +
        '<span class="file">/blocks/' + slug + '</span></span>' +
      '</a>'
    ).join('');
  }
  render('hero', 'g-hero');
  render('content', 'g-content');
  render('cta', 'g-cta');
</script>
</body>
</html>
