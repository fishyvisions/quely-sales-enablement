<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="/assets/colors_and_type.css">
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<style>
  body { margin:0; background:#5C28A4; font-family:'Inter',sans-serif; }
  a { color:#fff; } a:hover { color:#E4D3F5; }
  @keyframes qcta-in { to { opacity:1; transform:translateY(0); } }
  [data-qcta][data-go] [data-el="copy"] { animation:qcta-in 560ms cubic-bezier(.3,0,0,1) var(--d) forwards; }
  @media (prefers-reduced-motion: reduce) {
    [data-qcta] [data-el] { animation-duration:1ms !important; animation-delay:0ms !important; }
  }
</style>
</helmet>
<section style="position:relative; overflow:hidden; background:#5C28A4; padding:104px 40px 112px; display:flex; justify-content:center;">
  <div style="position:absolute; top:-30%; left:50%; width:1040px; height:700px; transform:translateX(-50%); border-radius:50%; background:radial-gradient(closest-side, rgba(255,255,255,.1), rgba(255,255,255,0)); pointer-events:none;"></div>

  <div data-qcta style="position:relative; z-index:1; width:100%; max-width:800px; display:flex; flex-direction:column; align-items:center; text-align:center;">

    <div data-el="copy" style="{{ eyebrowStyle }}">
      <span style="flex:none; width:20px; height:20px; background:url('/assets/quely-mark-brand.svg') center/contain no-repeat; filter:brightness(0) invert(1);"></span>
      <span style="font-size:11.5px; font-weight:700; letter-spacing:.15em; text-transform:uppercase; color:rgba(255,255,255,.84);">{{ eyebrow }}</span>
    </div>

    <h2 data-el="copy" style="{{ headlineStyle }}">{{ headline }}</h2>
    <p data-el="copy" style="{{ bodyStyle }}">{{ body }}</p>

    <div data-el="copy" style="{{ actionsStyle }}">
      <a href="{{ primaryHref }}" style="text-decoration:none;">
        <span style="display:inline-flex; align-items:center; gap:9px; white-space:nowrap; background:#fff; border:1px solid transparent; border-radius:8px; padding:16px 28px; font-size:15.5px; font-weight:700; color:#4B1F88; box-shadow:0 24px 48px rgba(3,7,18,.18);">
          {{ primaryCta }}<i class="ph-bold ph-arrow-right" style="font-size:15px;"></i>
        </span>
      </a>
    </div>
    <div style="{{ contactStyle }}">{{ contact }}</div>

  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1260,&quot;height&quot;:620}}">
class Component extends DCLogic {
  DEMO = {
    eyebrow: 'See Quely with your own work',
    headline: 'See your project in one searchable Space.',
    body: 'Bring a current project, sprint, or task into Quely. See how it connects discussions, meetings, documents, decisions, and dependencies so your team can find what it needs without searching across tools.',
    primaryCta: 'Try Quely',
    primaryHref: 'https://meetings.hubspot.com/ronma2/?utm_source=sales_enablement&utm_medium=block',
    contact: 'quely.io · ronma@quely.io',
    footnote: 'Your work items stay in the tools your team already uses.'
  };

  componentDidMount() {
    const start = () => {
      const node = document.querySelector('[data-qcta]');
      if (!node) { this._poll = setTimeout(start, 120); return; }
      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        node.setAttribute('data-go', ''); return;
      }
      const play = () => { if (this._played) return; this._played = true; node.setAttribute('data-go', ''); };
      if ('IntersectionObserver' in window) {
        this.io = new IntersectionObserver((entries) => {
          entries.forEach((e) => { if (e.isIntersecting) { this._t = setTimeout(play, 260); } });
        }, { threshold: 0.2 });
        this.io.observe(node);
      }
      this._safety = setTimeout(play, 2200);
    };
    this._played = false;
    start();
  }
  componentWillUnmount() {
    if (this.io) this.io.disconnect();
    clearTimeout(this._t); clearTimeout(this._poll); clearTimeout(this._safety);
  }

  renderVals() {
    const p = this.props || {}, D = this.DEMO;
    return {
      eyebrow: p.eyebrow ?? D.eyebrow,
      headline: p.headline ?? D.headline,
      body: p.body ?? D.body,
      primaryCta: p.primaryCta ?? D.primaryCta,
      primaryHref: p.primaryHref ?? D.primaryHref,
      contact: p.contact ?? D.contact,
      footnote: p.footnote ?? D.footnote,

      eyebrowStyle: 'display:flex; align-items:center; gap:14px; margin-bottom:26px;'
        + ' opacity:0; transform:translateY(10px); --d:100ms;',
      headlineStyle: 'margin:0; max-width:780px; font-size:52px; line-height:1.08; letter-spacing:-.032em;'
        + ' font-weight:800; color:#fff; text-wrap:pretty; opacity:0; transform:translateY(12px); --d:200ms;',
      bodyStyle: 'margin:22px 0 0; max-width:620px; font-size:17.5px; line-height:1.6; color:rgba(255,255,255,.82);'
        + ' text-wrap:pretty; opacity:0; transform:translateY(12px); --d:320ms;',
      contactStyle: 'margin-top:26px; font-size:14px; color:rgba(255,255,255,.72);',
      actionsStyle: 'display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:13px;'
        + ' margin-top:38px; opacity:0; transform:translateY(12px); --d:440ms;',
      footnoteStyle: 'margin-top:24px; font-size:13px; color:rgba(255,255,255,.72); text-wrap:pretty;'
        + ' opacity:0; transform:translateY(10px); --d:560ms;'
    };
  }
}
</script>
</body>
</html>
