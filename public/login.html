<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Quely Sales</title>
<link rel="stylesheet" href="/assets/colors_and_type.css">
<link rel="icon" href="/assets/quely-mark-brand.svg">
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#1A1611; font-family:'Inter',sans-serif; }
  .bg { position:fixed; inset:0; opacity:.5; background-image:radial-gradient(rgba(236,231,242,0.07) 1px, transparent 1px); background-size:26px 26px; pointer-events:none; }
  .card { position:relative; width:100%; max-width:380px; background:#F8F5FB; border:2px solid #1A1611; border-radius:0; padding:34px 30px; box-shadow:6px 6px 0 #5C28A4; }
  .logo { height:26px; display:block; margin:0 auto 26px; }
  h1 { margin:0 0 6px; font-size:22px; font-weight:800; letter-spacing:-.02em; color:#1A1611; text-align:center; }
  p.sub { margin:0 0 24px; font-size:14px; color:#5C5345; text-align:center; }
  label { display:block; font-size:12px; font-weight:600; color:#4B5563; margin-bottom:7px; }
  input { width:100%; box-sizing:border-box; background:#fff; border:1px solid #D9D2E6; border-radius:10px; padding:12px 14px; font-family:inherit; font-size:15px; color:#1A1611; outline:none; }
  input:focus { border-color:#5C28A4; box-shadow:0 0 0 3px rgba(92,40,164,.18); }
  button { width:100%; margin-top:18px; background:#5C28A4; color:#fff; font-size:15px; font-weight:600; padding:13px; border:2px solid #1A1611; border-radius:10px; cursor:pointer; font-family:inherit; box-shadow:3px 3px 0 #1A1611; transition:transform .12s, box-shadow .12s; }
  button:hover { transform:translate(-1px,-1px); box-shadow:4px 4px 0 #1A1611; }
  .err { margin-top:14px; font-size:13px; color:#B91C1C; text-align:center; min-height:18px; }
  .hint { margin-top:20px; font-size:12px; color:#8A8172; text-align:center; line-height:1.5; }
</style>
</head>
<body>
<div class="bg"></div>
<form class="card" id="form">
  <img class="logo" src="/assets/quely-logo-light.svg" alt="Quely" onerror="this.src='/assets/quely-logo-dark.svg'">
  <h1>Sales enablement</h1>
  <p class="sub">Sign in to manage prospect links and engagement.</p>
  <label for="pw">Team password</label>
  <input id="pw" type="password" autocomplete="current-password" placeholder="••••••••" autofocus>
  <button type="submit">Sign in</button>
  <div class="err" id="err"></div>
  <div class="hint">Prospect links (<code>/v/&lt;token&gt;</code>) don't need a login — only this dashboard does.</div>
</form>
<script>
  const form = document.getElementById('form');
  const err = document.getElementById('err');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    err.textContent = '';
    const password = document.getElementById('pw').value;
    try {
      const r = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password })
      });
      if (r.ok) { window.location.href = '/dashboard'; }
      else { err.textContent = 'Incorrect password. Try again.'; }
    } catch (_) { err.textContent = 'Something went wrong. Try again.'; }
  });
</script>
</body>
</html>
