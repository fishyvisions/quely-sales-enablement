<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quely — Sales Dashboard</title>
<link rel="icon" href="/assets/quely-mark-brand.svg">
<link rel="stylesheet" href="/assets/colors_and_type.css">
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<style>
  body { margin:0; background:#ECE7F2; }
  * { box-sizing:border-box; }
  input, select, textarea { font-family:'Inter',sans-serif; }
  ::selection { background:#C9C1F2; }
  .navbtn { display:flex; align-items:center; gap:11px; width:100%; text-align:left; font-family:inherit; font-size:15px; font-weight:600; padding:11px 12px; border:none; border-radius:10px; cursor:pointer; background:transparent; color:rgba(255,255,255,.6); }
  .navbtn.active { background:rgba(143,91,215,.22); color:#fff; }
  .mono { font-family:'Geist Mono','Inter',monospace; }
  .geist { font-family:'Geist','Inter',sans-serif; }
</style>
</head>
<body>
<div style="display:flex; height:100vh; font-family:'Inter',sans-serif; color:#1A1611; overflow:hidden;">

  <!-- SIDEBAR -->
  <div style="flex:none; width:236px; background:#1A1611; padding:24px 18px; display:flex; flex-direction:column; gap:6px;">
    <img src="/assets/quely-logo-dark.svg" alt="Quely" style="height:24px; margin:6px 8px 22px;">
    <div class="mono" style="font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:rgba(255,255,255,.38); padding:0 10px; margin-bottom:8px;">Sales enablement</div>
    <button class="navbtn active" data-nav="prospects"><i class="ph ph-users-three" style="font-size:20px;"></i>Prospects</button>
    <button class="navbtn" data-nav="analytics"><i class="ph ph-chart-bar" style="font-size:20px;"></i>Analytics</button>
    <button class="navbtn" data-nav="library"><i class="ph ph-squares-four" style="font-size:20px;"></i>Library</button>
    <button class="navbtn" id="navBuilder"><i class="ph ph-stack-plus" style="font-size:20px;"></i>Page Builder</button>
    <button class="navbtn" data-nav="questions"><i class="ph ph-chat-teardrop-text" style="font-size:20px;"></i>Questions <span id="qBadge" style="margin-left:auto; font-size:12px; font-weight:700; min-width:20px; height:20px; padding:0 6px; border-radius:9999px; display:inline-flex; align-items:center; justify-content:center; background:rgba(255,255,255,.12); color:rgba(255,255,255,.5);">0</span></button>
    <div style="margin-top:auto; padding:14px 10px 4px; border-top:1px solid rgba(255,255,255,.08);">
      <div style="font-size:12px; color:rgba(255,255,255,.4); line-height:1.5;">Shared database backend. Prospect links (<span style="color:rgba(255,255,255,.6);">/v/&lt;token&gt;</span>) need no login.</div>
      <button id="logout" style="margin-top:12px; background:none; border:none; color:rgba(255,255,255,.4); font-size:12px; font-weight:600; cursor:pointer; padding:0; display:inline-flex; align-items:center; gap:6px;"><i class="ph ph-sign-out"></i>Sign out</button>
    </div>
  </div>

  <!-- MAIN -->
  <div style="flex:1; min-width:0; display:flex; flex-direction:column;">

    <!-- topbar -->
    <div style="flex:none; height:64px; border-bottom:1px solid #E5E7EB; background:#fff; display:flex; align-items:center; justify-content:space-between; padding:0 28px;">
      <div id="viewTitle" class="geist" style="font-size:19px; font-weight:700;">Prospects</div>
      <div style="position:relative;">
        <button id="notifToggle" style="position:relative; background:#fff; border:2px solid #1A1611; border-radius:0; box-shadow:3px 3px 0 #1A1611; width:42px; height:42px; cursor:pointer; display:flex; align-items:center; justify-content:center;"><i class="ph ph-bell" style="font-size:20px; color:#374151;"></i><span id="notifBadge" style="display:none; position:absolute; top:-5px; right:-5px; background:#DC2626; color:#fff; font-size:11px; font-weight:700; min-width:18px; height:18px; padding:0 4px; border-radius:9999px; align-items:center; justify-content:center;">0</span></button>
        <div id="notifPanel" style="display:none; position:absolute; right:0; top:52px; width:360px; background:#fff; border:2px solid #1A1611; border-radius:0; box-shadow:0 16px 40px -10px rgba(3,7,18,.28); z-index:40; overflow:hidden;">
          <div style="display:flex; align-items:center; justify-content:space-between; padding:15px 18px; border-bottom:1px solid #F3F4F6;"><div style="font-size:14px; font-weight:700;">Notifications</div><button id="notifClear" style="background:none; border:none; color:#5C28A4; font-size:13px; font-weight:600; cursor:pointer;">Clear</button></div>
          <div id="notifList" style="max-height:340px; overflow:auto;"></div>
        </div>
      </div>
    </div>

    <!-- scroll content -->
    <div style="flex:1; min-height:0; overflow:auto; padding:28px;">

      <!-- ============ PROSPECTS ============ -->
      <div data-view="prospects">
        <div style="max-width:1180px;">
          <!-- create form -->
          <div style="background:#fff; border:2px solid #1A1611; border-radius:0; box-shadow:5px 5px 0 #1A1611; padding:22px 24px; margin-bottom:22px;">
            <div style="font-size:16px; font-weight:700; margin-bottom:16px;">New prospect link</div>
            <div id="createFields" style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
              <div><label style="display:block; font-size:12px; font-weight:600; color:#5C5345; margin-bottom:6px;">Name</label><input id="fName" placeholder="Sarah Chen" style="width:100%; font-size:14px; color:#1A1611; padding:10px 12px; border:1px solid #D8D2E4; border-radius:8px; background:#fff;"></div>
              <div><label style="display:block; font-size:12px; font-weight:600; color:#5C5345; margin-bottom:6px;">Company</label><input id="fCompany" placeholder="Acme" style="width:100%; font-size:14px; color:#1A1611; padding:10px 12px; border:1px solid #D8D2E4; border-radius:8px; background:#fff;"></div>
              <div><label style="display:block; font-size:12px; font-weight:600; color:#5C5345; margin-bottom:6px;">Email</label><input id="fEmail" placeholder="sarah@acme.com" style="width:100%; font-size:14px; color:#1A1611; padding:10px 12px; border:1px solid #D8D2E4; border-radius:8px; background:#fff;"></div>
              <div><label style="display:block; font-size:12px; font-weight:600; color:#5C5345; margin-bottom:6px;">Role</label><input id="fRole" placeholder="VP Engineering" style="width:100%; font-size:14px; color:#1A1611; padding:10px 12px; border:1px solid #D8D2E4; border-radius:8px; background:#fff;"></div>
            </div>

            <!-- primary button sits here when personalize is OFF -->
            <div id="primaryTop"></div>

            <!-- personalize toggle -->
            <div style="margin-top:16px; border-top:1px solid #F3F4F6; padding-top:16px;">
              <button id="persoToggle" type="button" style="display:flex; align-items:center; gap:12px; width:100%; background:transparent; border:none; padding:0; cursor:pointer; text-align:left;">
                <span id="persoTrack" style="flex:none; width:42px; height:24px; border-radius:9999px; position:relative; transition:background .16s; background:#D1D5DB;"><span id="persoKnob" style="position:absolute; top:3px; left:3px; width:18px; height:18px; border-radius:50%; background:#fff; transition:transform .16s; transform:translateX(0);"></span></span>
                <span style="flex:1; min-width:0;">
                  <span style="display:block; font-size:14px; font-weight:700; color:#1A1611;">Personalized page</span>
                  <span style="display:block; font-size:12px; color:#5C5345;">Build a page around this prospect's problem. Off = the standard Quely page.</span>
                </span>
                <span id="persoBadge" class="mono" style="flex:none; font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; padding:4px 10px; border-radius:9999px; background:#F3F4F6; color:#5C5345;">Off</span>
              </button>
              <!-- primary button moves here when personalize is ON -->
              <div id="primaryBottom"></div>
            </div>

            <div id="primaryWrap" style="display:flex; justify-content:center; margin-top:18px;">
              <div style="width:100%; max-width:420px;"><button id="createPrimary" style="width:100%; background:#5C28A4; color:#fff; font-size:15px; font-weight:700; padding:11px; border:2px solid #1A1611; border-radius:0; box-shadow:4px 4px 0 #1A1611; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px;"><i class="ph ph-link" style="font-size:18px;"></i><span id="createPrimaryLabel">Generate link</span></button></div>
            </div>

            <div id="createdBanner" style="display:none; margin-top:16px; background:#F5EEFB; border:2px solid #1A1611; border-radius:0; padding:14px 16px; align-items:center; gap:12px;">
              <i class="ph-fill ph-check-circle" style="font-size:22px; color:#5C28A4;"></i>
              <div style="flex:1; min-width:0;"><div style="font-size:13px; font-weight:600; color:#5C28A4; margin-bottom:2px;">Link ready for <span id="createdName"></span></div><div id="createdPretty" style="font-size:13px; color:#4B5563; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;"></div></div>
              <a id="createdOpen" href="#" target="_blank" rel="noopener" style="text-decoration:none;"><span style="display:inline-flex; align-items:center; gap:7px; background:#fff; border:1px solid #D1D5DB; border-radius:8px; padding:8px 14px; font-size:13px; font-weight:600; color:#111827;"><i class="ph ph-arrow-square-out"></i>Open</span></a>
              <button id="copyBtn" style="background:#1A1611; color:#fff; border:2px solid #1A1611; border-radius:0; box-shadow:3px 3px 0 #5C28A4; padding:9px 14px; font-size:13px; font-weight:600; cursor:pointer;">Copy</button>
            </div>
          </div>

          <!-- list -->
          <div style="background:#fff; border:2px solid #1A1611; border-radius:0; box-shadow:5px 5px 0 #1A1611; overflow:hidden;">
            <div class="mono" style="display:grid; grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,.7fr) minmax(0,.8fr) minmax(0,1.3fr) 24px; gap:12px; padding:13px 20px; border-bottom:2px solid #1A1611; font-size:11px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:#4B5563;">
              <div>Prospect</div><div>Status</div><div>Visits</div><div>Time</div><div>Most viewed</div><div></div>
            </div>
            <div id="prospectList"></div>
          </div>
        </div>
      </div>

      <!-- ============ ANALYTICS ============ -->
      <div data-view="analytics" style="display:none;"><div id="analyticsRoot" style="max-width:1180px;"></div></div>

      <!-- ============ LIBRARY ============ -->
      <div data-view="library" style="display:none;"><div id="libraryRoot" style="max-width:1180px;"></div></div>

      <!-- ============ QUESTIONS ============ -->
      <div data-view="questions" style="display:none;"><div id="questionsRoot" style="max-width:820px; display:flex; flex-direction:column; gap:12px;"></div></div>

    </div>
  </div>
</div>

<!-- DETAIL MODAL -->
<div id="detailModal" style="display:none; position:fixed; top:0; right:0; bottom:0; left:236px; z-index:60; align-items:center; justify-content:center; padding:28px;">
  <div id="detailScrim" style="position:absolute; inset:0; background:rgba(26,22,17,.55);"></div>
  <div style="position:relative; width:100%; max-width:640px; max-height:calc(100vh - 56px); overflow:auto; background:#fff; border:2px solid #1A1611; box-shadow:8px 8px 0 #1A1611; padding:22px 24px;">
    <button id="detailClose" style="position:absolute; top:18px; right:18px; background:none; border:none; cursor:pointer; color:#4B5563; font-size:20px;"><i class="ph ph-x"></i></button>
    <div id="detailBody"></div>
  </div>
</div>

<!-- ============ PAGE BUILDER (overlay) — matches Quely Page Builder.dc.html ============ -->
<div id="builder" style="display:none; position:fixed; inset:0; z-index:80; background:#ECE7F2; flex-direction:column;">
  <!-- top bar -->
  <div style="flex:none; display:flex; align-items:center; gap:14px; padding:12px 22px; background:#1A1611; color:#ECE7F2;">
    <button id="bBack" style="display:inline-flex; align-items:center; gap:7px; color:#C9C1F2; font-size:13.5px; font-weight:600; text-decoration:none; background:none; border:none; cursor:pointer; font-family:inherit;"><i class="ph ph-arrow-left" style="font-size:15px;"></i>Dashboard</button>
    <span style="width:1px; height:18px; background:rgba(236,231,242,.22);"></span>
    <span class="geist" style="font-size:17px; font-weight:800; letter-spacing:-.02em;">Page Builder</span>
    <span style="flex:1;"></span>
    <span id="bSummary" class="mono" style="font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:rgba(236,231,242,.7);"></span>
  </div>
  <div style="flex:1; min-height:0; display:flex;">
    <!-- LEFT: controls -->
    <div style="flex:none; width:380px; box-sizing:border-box; overflow-y:auto; background:#F8F5FB; border-right:2px solid #1A1611; padding:20px 20px 28px; display:flex; flex-direction:column; gap:20px;">
      <!-- 1 · Prospect -->
      <div style="display:flex; flex-direction:column; gap:10px;">
        <div class="mono" style="font-size:11px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:#5C28A4;">1 &middot; Prospect</div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
          <input id="bName" placeholder="Name" style="box-sizing:border-box; width:100%; padding:9px 11px; border:1px solid #D8D2E4; border-radius:8px; background:#fff; font-size:13.5px; color:#1A1611;">
          <input id="bCompany" placeholder="Company" style="box-sizing:border-box; width:100%; padding:9px 11px; border:1px solid #D8D2E4; border-radius:8px; background:#fff; font-size:13.5px; color:#1A1611;">
        </div>
        <select id="bTopic" style="box-sizing:border-box; width:100%; padding:9px 11px; border:1px solid #D8D2E4; border-radius:8px; background:#fff; font-size:13.5px; color:#1A1611;"></select>
      </div>
      <!-- 2 · Blocks on the page -->
      <div style="display:flex; flex-direction:column; gap:10px;">
        <div style="display:flex; align-items:center; gap:8px;">
          <div class="mono" style="flex:1; font-size:11px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:#5C28A4;">2 &middot; Blocks on the page</div>
          <button id="bRegen" style="display:inline-flex; align-items:center; gap:6px; white-space:nowrap; padding:7px 12px; border:1px solid #1A1611; background:#fff; border-radius:8px; font-size:12.5px; font-weight:600; color:#1A1611; cursor:pointer; font-family:inherit;"><i class="ph ph-arrows-clockwise" style="font-size:13px;"></i>Regenerate</button>
        </div>
        <div id="bConfirm"></div>
        <div id="bList" style="display:flex; flex-direction:column; gap:10px;"></div>
        <div style="position:relative;">
          <button id="bAdd" style="display:flex; align-items:center; justify-content:center; gap:8px; width:100%; padding:11px 14px; border:2px dashed #5C28A4; background:#F3EEFB; border-radius:10px; font-size:13.5px; font-weight:700; color:#4B1F88; cursor:pointer; font-family:inherit;"><i class="ph-bold ph-plus" style="font-size:14px;"></i>Add block</button>
          <div id="bPicker2" style="display:none; margin-top:8px; background:#fff; border:2px solid #1A1611; box-shadow:4px 4px 0 #1A1611; max-height:320px; overflow-y:auto;"></div>
        </div>
      </div>
      <!-- 3 · Publish -->
      <div style="display:flex; flex-direction:column; gap:10px; margin-top:auto;">
        <div class="mono" style="font-size:11px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:#5C28A4;">3 &middot; Publish</div>
        <button id="bPublish" style="display:inline-flex; align-items:center; justify-content:center; gap:9px; padding:13px 16px; border:2px solid #1A1611; background:#5C28A4; color:#fff; font-size:14.5px; font-weight:700; cursor:pointer; box-shadow:4px 4px 0 #1A1611; font-family:inherit;"><i class="ph-bold ph-paper-plane-tilt" style="font-size:15px;"></i><span id="bPublishLabel">Publish and create link</span></button>
        <div id="bLinkCard"></div>
        <div style="font-size:12px; line-height:1.5; color:#4B5563;">The published page matches this preview exactly.</div>
      </div>
    </div>
    <!-- RIGHT: live preview -->
    <div id="bPreviewCol" style="flex:1; min-width:0; overflow-y:auto; overflow-x:hidden; background:#D8D2E4; padding:22px;">
      <div id="bPreview" style="width:1260px; zoom:.56; display:flex; flex-direction:column; background:#ECE7F2; border:2px solid #1A1611; box-shadow:10px 10px 0 #1A1611;"></div>
    </div>
  </div>
</div>

<script src="/js/blocks-render.js"></script>
<script src="/js/dashboard.js"></script>
</body>
</html>
